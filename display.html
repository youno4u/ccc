<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>성도의 견인 — 송출</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#050d0a;overflow:hidden;width:100vw;height:100vh;font-family:"Noto Sans KR",sans-serif;}
canvas{display:block;width:100%;height:100%;}
#lobby{position:fixed;inset:0;background:rgba(5,13,10,.93);backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;color:white;}
#lobby.hidden{display:none;}
.lb-logo{font-size:5rem;font-weight:900;color:#4ade80;text-shadow:0 0 50px rgba(74,222,128,.5);}
.lb-tit{font-size:2.2rem;font-weight:900;color:#4ade80;}
.lb-sub{font-size:1.1rem;color:#475569;}
#lb-cnt{font-size:1.3rem;font-weight:700;color:#334155;}
#pvs-banner{position:fixed;top:0;left:0;right:0;padding:.7rem;text-align:center;font-size:1.2rem;font-weight:900;color:#fde68a;display:none;z-index:10;background:linear-gradient(90deg,transparent,rgba(250,204,21,.25),transparent);animation:pb 1.5s ease-in-out infinite;}
@keyframes pb{0%,100%{opacity:.8}50%{opacity:1}}
#win{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;color:white;z-index:20;}
#win.show{display:flex;animation:wI 1s ease;}
@keyframes wI{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.win-tit{font-size:4rem;font-weight:900;text-align:center;}
.win-verse{padding:1.2rem 2rem;border:1px solid rgba(74,222,128,.3);border-radius:1rem;background:rgba(74,222,128,.07);font-size:1.1rem;color:#bbf7d0;text-align:center;line-height:1.7;max-width:600px;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="pvs-banner"></div>
<div id="lobby">
  <div class="lb-logo">✝</div>
  <div class="lb-tit">성도의 견인</div>
  <div class="lb-sub">선생님이 시작하면 게임이 시작됩니다</div>
  <div id="lb-cnt"></div>
</div>
<div id="win">
  <div style="font-size:5rem;">✝</div>
  <div class="win-tit" id="win-tit"></div>
  <div class="win-verse">
    "내가 그들에게 영생을 주노니 영원히 멸망하지 아니할 것이요<br>
    또 그들을 내 손에서 빼앗을 자가 없느니라"<br>
    <span style="font-size:.9rem;color:#86efac;">— 요한복음 10:28</span>
  </div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { getFirestore,doc,onSnapshot,collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

const FB=initializeApp({apiKey:"AIzaSyCfyjgtiDVD4Wsd9iGb9tEdrOGFYxxN2Tw",authDomain:"kingdomgenius.firebaseapp.com",projectId:"kingdomgenius",storageBucket:"kingdomgenius.firebasestorage.app",messagingSenderId:"385557748196",appId:"1:385557748196:web:457b999a38e4982f188ff1"});
const auth=getAuth(FB),db=getFirestore(FB);
const ROOT="kingdom_genius_games/pvs3_room";
const STATE=doc(db,ROOT,"data/state");
const PCOL=collection(db,ROOT,"players");
const ECOL=collection(db,ROOT,"enemies");
const SCOL=collection(db,ROOT,"saints");

const GW=5000,GH=700;
const SPAWN={x:100,y:350};
const HEAVEN={x:4900,y:350,r:70};
const GAME_DURATION=480;
const PVS_MS=20000;
const NUM_SAINTS=8;
const SAINT_SPD=0.42;
const SAINT_R=12;
const SAINT_MAX_HP=120;

const SAINT_WP=[
  {x:100,y:350},{x:500,y:350},{x:850,y:220},{x:1150,y:350},{x:1500,y:480},
  {x:1850,y:350},{x:2200,y:220},{x:2600,y:350},{x:3000,y:350},{x:3400,y:480},
  {x:3800,y:350},{x:4200,y:220},{x:4600,y:350},{x:4900,y:350},
];

const ETYPES={
  yuhok: {name:"유혹",  r:13,col:"#f59e0b",icon:"💸",spd:2.0},
  uisim: {name:"의심",  r:16,col:"#6366f1",icon:"🌀",spd:1.7},
  gyoman:{name:"교만",  r:20,col:"#7c3aed",icon:"👑",spd:1.4},
  duryum:{name:"두려움",r:14,col:"#dc2626",icon:"😱",spd:2.4},
  hibak: {name:"핍박",  r:17,col:"#b45309",icon:"⚔",spd:1.9},
  sesang:{name:"세상",  r:23,col:"#0891b2",icon:"🌍",spd:1.2},
  guardian:{name:"수문장",r:28,col:"#7f1d1d",icon:"☠",spd:1.0},
};

const WAVES=[
  [6,  [{t:"yuhok",x:800,y:100},{t:"yuhok",x:800,y:600},{t:"yuhok",x:1000,y:300}]],
  [30, [{t:"yuhok",x:1100,y:80},{t:"uisim",x:1200,y:350},{t:"yuhok",x:1100,y:620}]],
  [58, [{t:"uisim",x:1600,y:100},{t:"uisim",x:1600,y:600},{t:"gyoman",x:1700,y:350}]],
  [88, [{t:"gyoman",x:2000,y:200},{t:"duryum",x:2100,y:350},{t:"gyoman",x:2000,y:500}]],
  [118,[{t:"duryum",x:2400,y:80},{t:"hibak",x:2500,y:350},{t:"duryum",x:2400,y:620},{t:"uisim",x:2300,y:200}]],
  [148,[{t:"hibak",x:2800,y:150},{t:"hibak",x:2800,y:550},{t:"gyoman",x:2900,y:350},{t:"duryum",x:2700,y:350}]],
  [180,[{t:"sesang",x:3200,y:200},{t:"sesang",x:3200,y:500},{t:"hibak",x:3100,y:350}]],
  [215,[{t:"sesang",x:3500,y:100},{t:"gyoman",x:3600,y:350},{t:"sesang",x:3500,y:600},{t:"duryum",x:3400,y:350}]],
  [250,[{t:"sesang",x:3800,y:200},{t:"sesang",x:3800,y:500},{t:"gyoman",x:3900,y:100},{t:"gyoman",x:3900,y:600}]],
  [290,[{t:"sesang",x:4100,y:300},{t:"sesang",x:4100,y:400},{t:"hibak",x:4000,y:200},{t:"hibak",x:4000,y:500}]],
  [330,[{t:"guardian",x:4820,y:200},{t:"guardian",x:4820,y:350},{t:"guardian",x:4820,y:500}]],
];

const WALLS=(()=>{
  const w=[];
  w.push({x:0,y:0,w:GW,h:20},{x:0,y:680,w:GW,h:20},{x:0,y:0,w:20,h:GH},{x:4980,y:0,w:20,h:GH});
  function barrier(x,gapY,thick=38,gapH=140){
    const g1=gapY-gapH/2,g2=gapY+gapH/2;
    if(g1>20)w.push({x,y:20,w:thick,h:g1-20});
    if(g2<680)w.push({x,y:g2,w:thick,h:680-g2});
  }
  barrier(460,350);barrier(700,350);barrier(960,220);
  barrier(1160,480);barrier(1420,480);barrier(1650,350);barrier(1900,350);
  barrier(2150,220);barrier(2380,350);barrier(2620,350);barrier(2860,350);
  w.push({x:3050,y:180,w:36,h:36});w.push({x:3050,y:484,w:36,h:36});
  w.push({x:3260,y:280,w:36,h:36});w.push({x:3260,y:384,w:36,h:36});
  barrier(3430,480);barrier(3670,350);barrier(3900,350);
  barrier(4140,220);barrier(4380,350);barrier(4620,350);
  w.push({x:4750,y:20,w:50,h:260});w.push({x:4750,y:420,w:50,h:260});
  return w;
})();

const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");
let W,H;
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
window.addEventListener("resize",resize);resize();

// 스케일: 맵 전체를 화면에 맞춤
const getSX=()=>W/GW;
const getSY=()=>H/GH;
function mp(wx,wy){return{x:wx*getSX(),y:wy*getSY()};}

let allPlayers={},saintHPs={},enemyHPs={};
let gameStartTime=0,pvsActive=false,pvsEnd=0,heavenReached=false;
let localEnemies=[],processedWaves=new Set();
const STARS=Array.from({length:200},()=>({x:Math.random()*GW,y:Math.random()*GH,r:Math.random()*1.1+.3,a:Math.random()*.2+.05}));

function getSaintPos(idx,elapsedMs){
  const wps=SAINT_WP;const sId="s"+idx;const hp=saintHPs[sId]??SAINT_MAX_HP;
  if(hp<=0)return{x:wps[0].x,y:wps[0].y,hp:0,dead:true,reached:false};
  let totalLen=0;const segLens=[];
  for(let i=1;i<wps.length;i++){const dl=Math.hypot(wps[i].x-wps[i-1].x,wps[i].y-wps[i-1].y);segLens.push(dl);totalLen+=dl;}
  const offset=idx*3000;const elapsed=Math.max(0,elapsedMs-offset);
  const maxX=heavenReached?HEAVEN.x:(()=>{let fx=SPAWN.x;Object.values(allPlayers).forEach(p=>{if((p.x||0)>fx)fx=p.x;});return fx;})();
  const rawDist=elapsed/1000*SAINT_SPD*60;
  let rem=rawDist;
  for(let i=0;i<segLens.length;i++){
    const wpNextX=wps[i+1].x;
    if(rem<=segLens[i]){
      const t=rem/segLens[i];const px=wps[i].x+(wps[i+1].x-wps[i].x)*t,py=wps[i].y+(wps[i+1].y-wps[i].y)*t;
      if(px>maxX){const tM=Math.max(0,Math.min(t,(maxX-wps[i].x)/(wps[i+1].x-wps[i].x+.001)));return{x:wps[i].x+(wps[i+1].x-wps[i].x)*tM,y:wps[i].y+(wps[i+1].y-wps[i].y)*tM,hp,dead:false,reached:false};}
      return{x:px,y:py,hp,dead:false,reached:false};
    }
    if(wpNextX>maxX){const tM=Math.max(0,Math.min(1,(maxX-wps[i].x)/(wps[i+1].x-wps[i].x+.001)));return{x:wps[i].x+(wps[i+1].x-wps[i].x)*tM,y:wps[i].y+(wps[i+1].y-wps[i].y)*tM,hp,dead:false,reached:false};}
    rem-=segLens[i];
  }
  return{x:HEAVEN.x,y:HEAVEN.y,hp,dead:false,reached:true};
}
function getActiveSaints(){
  if(gameStartTime===0)return[];const elapsed=Date.now()-gameStartTime;
  return Array.from({length:NUM_SAINTS},(_,i)=>({idx:i,...getSaintPos(i,elapsed),id:"s"+i}));
}

function processWaves(){
  if(gameStartTime===0)return;const elapsed=(Date.now()-gameStartTime)/1000;
  WAVES.forEach(([t,list],wi)=>{
    if(elapsed>=t&&!processedWaves.has(wi)){
      processedWaves.add(wi);
      list.forEach((e,ei)=>{
        const id="w"+wi+"e"+ei;
        if(!localEnemies.find(le=>le.id===id)){
          const et=ETYPES[e.t];const hp=enemyHPs[id]??et.r*15;
          localEnemies.push({id,type:e.t,x:e.x,y:e.y,hp,maxHp:hp});
        }
      });
    }
  });
  localEnemies.forEach(e=>{const h=enemyHPs[e.id];if(h!==undefined)e.hp=h;});
  localEnemies=localEnemies.filter(e=>e.hp>0);
}

function moveEnemies(){
  const saints=getActiveSaints();
  localEnemies.forEach(e=>{
    const et=ETYPES[e.type];let tx=HEAVEN.x/2,ty=GH/2,nearD=Infinity;
    saints.filter(s=>!s.dead&&!s.reached).forEach(s=>{const d=Math.hypot(s.x-e.x,s.y-e.y);if(d<nearD){nearD=d;tx=s.x;ty=s.y;}});
    const dd=Math.hypot(tx-e.x,ty-e.y);
    if(dd>et.r+10){e.x+=(tx-e.x)/dd*et.spd;e.y+=(ty-e.y)/dd*et.spd;}
  });
}

function render(ts){
  processWaves();moveEnemies();
  const SX=getSX(),SY=getSY();
  ctx.fillStyle="#050d0a";ctx.fillRect(0,0,W,H);
  // 별
  STARS.forEach(s=>{ctx.fillStyle=`rgba(255,255,255,${s.a})`;ctx.beginPath();ctx.arc(s.x*SX,s.y*SY,s.r,0,Math.PI*2);ctx.fill();});
  // 길
  ctx.fillStyle="rgba(10,22,10,.88)";ctx.fillRect(0,160*SY,W,(GH-320)*SY);
  // 벽
  WALLS.forEach(w=>{ctx.fillStyle="#14371e";ctx.fillRect(w.x*SX,w.y*SY,w.w*SX,w.h*SY);ctx.strokeStyle="rgba(74,222,128,.18)";ctx.lineWidth=1;ctx.strokeRect(w.x*SX,w.y*SY,w.w*SX,w.h*SY);});
  // 스폰
  ctx.fillStyle="rgba(74,222,128,.08)";ctx.strokeStyle="rgba(74,222,128,.3)";ctx.lineWidth=2;
  ctx.fillRect((SPAWN.x-50)*SX,(SPAWN.y-55)*SY,100*SX,110*SY);ctx.strokeRect((SPAWN.x-50)*SX,(SPAWN.y-55)*SY,100*SX,110*SY);
  // 천국
  const hx=HEAVEN.x*SX,hy=HEAVEN.y*SY,hr=HEAVEN.r*Math.min(SX,SY);
  const pulse=.7+Math.sin(ts/500)*.3;
  const g=ctx.createRadialGradient(hx,hy,0,hx,hy,hr*3.5);
  g.addColorStop(0,`rgba(250,204,21,${.28*pulse})`);g.addColorStop(1,"rgba(250,204,21,0)");
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(hx,hy,hr*3.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=`rgba(250,204,21,${.15*pulse})`;ctx.strokeStyle=`rgba(250,204,21,${.9*pulse})`;ctx.lineWidth=2.5;
  ctx.shadowBlur=25;ctx.shadowColor="#facc15";ctx.beginPath();ctx.arc(hx,hy,hr,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.shadowBlur=0;
  const fs=hr*.85;ctx.font=`bold ${fs}px sans-serif`;ctx.fillStyle=`rgba(250,204,21,${pulse})`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.shadowBlur=8;ctx.shadowColor="#facc15";ctx.fillText("✝",hx,hy);ctx.shadowBlur=0;
  ctx.font=`bold ${Math.max(10,14*Math.min(SX,SY)*2)}px Noto Sans KR`;ctx.fillStyle=`rgba(250,204,21,.8)`;ctx.textBaseline="top";ctx.fillText("천 국",hx,hy+hr+4);
  // 성도
  if(gameStartTime>0){
    const saints=getActiveSaints();
    saints.forEach(s=>{
      if(s.dead||s.reached)return;const p=mp(s.x,s.y);const r=SAINT_R*Math.min(SX,SY)*1.2;const hpPct=(s.hp||0)/SAINT_MAX_HP;
      ctx.shadowBlur=pvsActive?18:6;ctx.shadowColor=pvsActive?"#facc15":"rgba(255,255,255,.4)";
      ctx.fillStyle=pvsActive?"#fef08a":"rgba(255,255,255,.9)";ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
      ctx.font=`bold ${r*.85}px sans-serif`;ctx.fillStyle="#0a1628";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("✝",p.x,p.y);
      const bw=r*2.5,bh=3,bx=p.x-bw/2,by=p.y-r-5;
      ctx.fillStyle="#0f172a";ctx.fillRect(bx,by,bw,bh);if(bw*hpPct>0){ctx.fillStyle=hpPct>.5?"#4ade80":hpPct>.25?"#fbbf24":"#ef4444";ctx.fillRect(bx,by,bw*hpPct,bh);}
    });
    // 적
    localEnemies.forEach(e=>{
      const et=ETYPES[e.type];const p=mp(e.x,e.y);const r=et.r*Math.min(SX,SY)*1.2;const hpPct=e.hp/e.maxHp;
      ctx.shadowBlur=8;ctx.shadowColor=et.col;ctx.fillStyle=et.col;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
      ctx.font=`bold ${r*.85}px sans-serif`;ctx.fillStyle="white";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(et.icon,p.x,p.y);
      if(e.type!=="guardian"&&bw>0){
        const bw=r*2.4,bh=3,bx=p.x-bw/2,by=p.y-r-5;
        ctx.fillStyle="#0f172a";ctx.fillRect(bx,by,bw,bh);if(bw*hpPct>0){ctx.fillStyle=et.col;ctx.fillRect(bx,by,bw*hpPct,bh);}
      }
      ctx.font=`bold ${Math.max(8,r*.55)}px Noto Sans KR`;ctx.fillStyle="rgba(255,255,255,.55)";ctx.textBaseline="top";ctx.fillText(e.type==="guardian"?"???":et.name,p.x,p.y+r+3);
    });
  }
  // 플레이어
  Object.values(allPlayers).filter(p=>p.alive).forEach(p=>{
    if(!p._rx){p._rx=p.x;p._ry=p.y;}p._rx+=(p.x-p._rx)*.12;p._ry+=(p.y-p._ry)*.12;
    const pp=mp(p._rx,p._ry);const r=16*Math.min(SX,SY)*1.2;
    ctx.shadowBlur=8;ctx.shadowColor="#4ade80";ctx.fillStyle="#4ade80";ctx.beginPath();ctx.arc(pp.x,pp.y,r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    ctx.font=`bold ${Math.max(7,r*.52)}px Noto Sans KR`;ctx.fillStyle="#0a1628";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText((p.name||"").slice(0,4),pp.x,pp.y);
    const hp=Math.max(0,(p.hp||0)/(p.maxHp||100));const bw=r*2.6,bh=4*Math.min(SX,SY),bx=pp.x-bw/2,by=pp.y-r-6;
    ctx.fillStyle="#1e293b";ctx.fillRect(bx,by,bw,bh);if(bw*hp>0){ctx.fillStyle=hp>.5?"#4ade80":hp>.25?"#fbbf24":"#ef4444";ctx.fillRect(bx,by,bw*hp,bh);}
  });
  // HUD
  ctx.fillStyle="rgba(0,0,0,.65)";ctx.fillRect(0,0,W,38);
  if(gameStartTime>0){
    const elapsed=Math.floor((Date.now()-gameStartTime)/1000);const rem=Math.max(0,GAME_DURATION-elapsed);
    const m=Math.floor(rem/60),s=rem%60;
    ctx.fillStyle=rem<60?"#ef4444":rem<120?"#fbbf24":"rgba(255,255,255,.7)";
    ctx.font="bold 15px Noto Sans KR";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(`${m}:${String(s).padStart(2,"0")}`,W/2,19);
  }
  // 플레이어 수
  const ps=Object.values(allPlayers);const cnt=ps.length;const alive2=ps.filter(p=>p.alive).length;
  ctx.font="bold 13px Noto Sans KR";ctx.textAlign="left";ctx.textBaseline="middle";ctx.fillStyle="#4ade80";ctx.fillText(`✝ 수호자 ${alive2}/${cnt}명`,12,19);
  // 성도 현황
  if(gameStartTime>0){
    const saints=getActiveSaints();const reached=saints.filter(s=>s.reached).length;const dead=saints.filter(s=>s.dead).length;
    ctx.textAlign="right";ctx.fillStyle="#fbbf24";ctx.fillText(`성도 ${reached}/${NUM_SAINTS} 천국 / ${dead}명 쓰러짐`,W-12,19);
  }
  // 견인 배너
  if(pvsActive&&Date.now()<pvsEnd){document.getElementById("pvs-banner").style.display="block";document.getElementById("pvs-banner").textContent="✝ 성도의 견인 — 아무것도 끊을 수 없다! ✝";}
  else{document.getElementById("pvs-banner").style.display="none";}
  requestAnimationFrame(render);
}
requestAnimationFrame(render);

function setup(){
  onSnapshot(STATE,snap=>{
    if(!snap.exists())return;const d=snap.data();const ns=d.gameStatus||"lobby";
    if(d.gameStartTime)gameStartTime=d.gameStartTime;
    if(d.heavenReached)heavenReached=true;
    pvsActive=d.perseveranceActive||false;pvsEnd=d.perseveranceEnd||0;
    document.getElementById("lobby").classList.toggle("hidden",ns==="playing");
    if(d.winner||ns==="ended"){
      const wt=document.getElementById("win-tit");
      wt.textContent=d.success?"✝ 성도들이 천국에 도착했습니다!":"☠ 시간이 다했습니다";
      wt.style.color=d.success?"#4ade80":"#ef4444";
      document.getElementById("win").classList.add("show");
    } else {document.getElementById("win").classList.remove("show");}
    if(ns==="reset"){allPlayers={};localEnemies=[];processedWaves=new Set();gameStartTime=0;heavenReached=false;document.getElementById("win").classList.remove("show");}
  });
  onSnapshot(PCOL,snap=>{
    const uids=new Set();
    snap.forEach(d=>{const uid=d.id;uids.add(uid);if(!allPlayers[uid])allPlayers[uid]={...d.data(),uid};else Object.assign(allPlayers[uid],d.data(),{uid});});
    Object.keys(allPlayers).forEach(uid=>{if(!uids.has(uid))delete allPlayers[uid];});
    const cnt=snap.docs.length;
    document.getElementById("lb-cnt").textContent=cnt+"명 접속 중";
  });
  onSnapshot(ECOL,snap=>{snap.forEach(d=>{enemyHPs[d.id]=d.data().hp??0;});});
  onSnapshot(SCOL,snap=>{snap.forEach(d=>{saintHPs[d.id]=d.data().hp??SAINT_MAX_HP;});});
}
try{await signInAnonymously(auth);setup();}catch(e){console.error(e);}
</script>
</body>
</html>

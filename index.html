<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>성도의 견인</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:#0a1628;color:white;overflow:hidden;width:100vw;height:100vh;touch-action:none;user-select:none;}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:1.5rem;z-index:50;}
.screen.hidden{display:none;}
#entry{background:linear-gradient(160deg,#0a1628,#0d2040);}
.logo{font-size:3.8rem;font-weight:900;color:#4ade80;text-shadow:0 0 30px rgba(74,222,128,.6);letter-spacing:-2px;}
.logo-sub{font-size:.85rem;color:#334155;font-weight:700;}
.inp{width:100%;max-width:300px;padding:.85rem;font-size:1.2rem;font-family:'Noto Sans KR',sans-serif;background:#1e293b;border:2px solid #334155;border-radius:.9rem;color:white;text-align:center;outline:none;}
.inp:focus{border-color:#4ade80;}
.big-btn{width:100%;max-width:300px;padding:1rem;font-size:1.1rem;font-weight:900;font-family:'Noto Sans KR',sans-serif;border:none;border-radius:.9rem;cursor:pointer;}
.btn-green{background:linear-gradient(135deg,#16a34a,#15803d);color:white;}
.btn-blue{background:linear-gradient(135deg,#0ea5e9,#0284c7);color:white;}
.big-btn:active{transform:scale(.97);}
#gear{background:none;border:none;cursor:pointer;color:#1e293b;font-size:1.4rem;padding:.3rem;transition:color .2s,transform .3s;}
#gear:hover{color:#334155;transform:rotate(60deg);}
#pw-modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:300;}
#pw-modal.vis{display:flex;}
.pw-box{background:#1e293b;border:1px solid #334155;border-radius:1.5rem;padding:2rem 1.8rem;width:280px;display:flex;flex-direction:column;gap:1rem;align-items:center;}
.pw-tit{font-size:1rem;font-weight:700;color:#94a3b8;}
#pw-inp{width:100%;padding:.8rem;font-size:1.8rem;font-family:'Noto Sans KR',sans-serif;background:#0f172a;border:2px solid #334155;border-radius:.8rem;color:white;text-align:center;outline:none;letter-spacing:.4em;}
#pw-inp:focus{border-color:#4ade80;}
.pw-row{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;width:100%;}
.pw-ok{padding:.7rem;font-size:1rem;font-weight:900;font-family:'Noto Sans KR',sans-serif;background:#16a34a;color:white;border:none;border-radius:.6rem;cursor:pointer;}
.pw-cx{padding:.7rem;font-size:1rem;font-weight:700;font-family:'Noto Sans KR',sans-serif;background:#1e293b;color:#64748b;border:1px solid #334155;border-radius:.6rem;cursor:pointer;}
#pw-err{font-size:.8rem;color:#ef4444;min-height:.9rem;}
#gm{background:#060e18;z-index:200;justify-content:flex-start;padding:0;overflow-y:auto;align-items:stretch;}
.gmh{padding:1rem 1.5rem;background:#0a1628;border-bottom:1px solid #1e293b;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.gmh-tit{font-size:1.3rem;font-weight:900;color:#4ade80;}
.gm-body{padding:1.2rem;display:flex;flex-direction:column;gap:1rem;}
.sec{font-size:.7rem;font-weight:700;color:#475569;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid #1e293b;padding-bottom:.4rem;}
.stat-card{background:#1e293b;border-radius:.8rem;padding:.8rem;text-align:center;}
.pvs-full{padding:1.2rem;font-size:1.1rem;font-weight:900;font-family:'Noto Sans KR',sans-serif;background:linear-gradient(135deg,#854d0e,#713f12);color:#fde68a;border:none;border-radius:.8rem;cursor:pointer;box-shadow:0 0 25px rgba(250,204,21,.35);width:100%;}
.pvs-full:active{transform:scale(.96);}
.act-row{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;}
.sm-btn{padding:.9rem;font-size:1rem;font-weight:900;font-family:'Noto Sans KR',sans-serif;border:none;border-radius:.8rem;cursor:pointer;}
.sm-btn:active{transform:scale(.97);}
.gm-list{display:flex;flex-direction:column;gap:.3rem;max-height:200px;overflow-y:auto;}
.gm-item{display:flex;align-items:center;gap:.5rem;padding:.35rem .7rem;background:#1e293b;border-radius:.5rem;font-size:.8rem;}
#lobby{background:linear-gradient(160deg,#0a1628,#0d2040);}
#game-canvas{position:fixed;inset:0;width:100%;height:100%;display:none;z-index:10;}
#game-canvas.vis{display:block;}
#dead-ov{position:fixed;inset:0;z-index:110;background:rgba(0,0,0,.87);display:none;flex-direction:column;align-items:center;justify-content:center;gap:1rem;font-family:'Noto Sans KR',sans-serif;color:white;}
#dead-ov.vis{display:flex;}
#lvlup{position:fixed;top:15%;left:50%;transform:translateX(-50%);z-index:120;background:rgba(250,204,21,.15);border:2px solid rgba(250,204,21,.5);border-radius:1rem;padding:.8rem 2rem;text-align:center;display:none;font-family:'Noto Sans KR',sans-serif;}
#lvlup.show{display:block;animation:lvA 2.2s ease forwards;}
@keyframes lvA{0%{opacity:0;transform:translateX(-50%) scale(.8)}15%{opacity:1;transform:translateX(-50%) scale(1.1)}75%{opacity:1;transform:translateX(-50%) scale(1)}100%{opacity:0;transform:translateX(-50%) translateY(-30px)}}
#pvs-flash{position:fixed;inset:0;z-index:130;pointer-events:none;display:none;}
#pvs-flash.show{display:block;animation:pvsFlash 2s ease forwards;}
@keyframes pvsFlash{0%{background:rgba(250,204,21,0)}20%{background:rgba(250,204,21,.25)}80%{background:rgba(250,204,21,.1)}100%{background:rgba(250,204,21,0)}}
#end{background:radial-gradient(circle,#071a0a,#000);}
.end-tit{font-size:2.5rem;font-weight:900;text-align:center;}
.end-sub{font-size:1rem;color:rgba(255,255,255,.7);text-align:center;line-height:1.7;max-width:320px;}
.end-verse{padding:1rem 1.5rem;border:1px solid rgba(74,222,128,.25);border-radius:1rem;background:rgba(74,222,128,.07);font-size:.9rem;color:#bbf7d0;text-align:center;line-height:1.6;max-width:320px;}
</style>
</head>
<body>
<canvas id="game-canvas"></canvas>
<!-- 입장 -->
<div id="entry" class="screen">
  <div class="logo">성도의 견인</div>
  <div class="logo-sub">Perseverance of the Saints</div>
  <input class="inp" id="name-inp" type="text" placeholder="이름(최대5자)" maxlength="5" autocomplete="off" autocorrect="off">
  <button class="big-btn btn-green" id="join-btn">입장하기</button>
  <button id="gear">⚙</button>
</div>
<!-- 비번 -->

</div>
<!-- GM -->
<div id="gm" class="screen hidden">
  <div class="gmh">
    <div><div class="gmh-tit">⚙ GM 패널</div></div>
    <button id="exit-gm-btn" style="background:none;border:none;color:#475569;font-size:1.4rem;cursor:pointer;">✕</button>
  </div>
  <div class="gm-body">
    <div class="sec">현황</div>
    <div class="stat-card">
      <div style="font-size:.75rem;color:#64748b;margin-bottom:.4rem;">접속 인원</div>
      <div style="font-size:2rem;font-weight:900;color:#4ade80;" id="gm-count">0명</div>

    <div class="sec">게임 제어</div>
    <div class="act-row">
      <button class="sm-btn btn-green" id="start-btn">▶ 시작</button>
      <button class="sm-btn" id="reset-btn" style="background:#1e293b;color:#64748b;border:1px solid #334155;">↺ 초기화</button>
    </div>
    <button class="sm-btn btn-blue" id="replay-btn" style="width:100%;">🔄 다시하기</button>
    <div class="sec">플레이어 목록</div>
    <div class="gm-list" id="gm-list"></div>
  </div>
</div>
<!-- 대기실 -->
<div id="lobby" class="screen hidden">
  <div style="font-size:3rem;">✝</div>
  <div style="font-size:2rem;font-weight:900;color:#4ade80;">성도의 견인</div>
  <div style="font-size:.8rem;color:#334155;text-align:center;line-height:2;">왼쪽 드래그 → 이동<br>오른쪽 드래그 → 공격 방향<br>성도를 인도해 천국까지!</div>
  <div id="lobby-cnt" style="font-size:.8rem;color:#1e293b;"></div>
</div>
<!-- 사망 -->
<div id="dead-ov">
  <div style="font-size:3.5rem;">☠</div>
  <div style="font-size:1.8rem;font-weight:900;color:#ef4444;">쓰러졌습니다</div>
  <div style="font-size:.9rem;color:#94a3b8;text-align:center;">출발점으로 돌아갑니다</div>
  <div id="respawn-cnt" style="font-size:3rem;font-weight:900;color:#fbbf24;">5</div>
</div>
<!-- 레벨업 -->
<div id="lvlup"><div style="font-size:1.1rem;font-weight:900;color:#facc15;" id="lvlup-txt">레벨 업!</div></div>
<!-- 견인 플래시 -->
<div id="pvs-flash"></div>
<!-- 종료 -->
<div id="end" class="screen hidden">
  <div id="end-tit" class="end-tit"></div>
  <div id="end-sub" class="end-sub"></div>
  <div class="end-verse">
    "내 아버지의 손에서 빼앗을 자가 없느니라"<br>
    <span style="font-size:.8rem;color:#86efac;">— 요한복음 10:29</span>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { getFirestore,doc,setDoc,updateDoc,onSnapshot,collection,writeBatch,getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

const FB=initializeApp({apiKey:"AIzaSyCfyjgtiDVD4Wsd9iGb9tEdrOGFYxxN2Tw",authDomain:"kingdomgenius.firebaseapp.com",projectId:"kingdomgenius",storageBucket:"kingdomgenius.firebasestorage.app",messagingSenderId:"385557748196",appId:"1:385557748196:web:457b999a38e4982f188ff1"});
const auth=getAuth(FB),db=getFirestore(FB);
const ROOT='kingdom_genius_games/pvs3_room';
const STATE=doc(db,ROOT,'data/state');
const PCOL=collection(db,ROOT,'players');
const ECOL=collection(db,ROOT,'enemies');
const PREF=uid=>doc(db,ROOT,'players',uid);
const EREF=id=>doc(db,ROOT,'enemies',id);

// ── 월드 ──────────────────────────────────────────────
const GW=5000,GH=700;
const SPAWN={x:120,y:350};
const HEAVEN={x:4880,y:350,r:70};
const GAME_DURATION=480; // 8분
const RESPAWN_MS=5000;
const PVS_MS=20000;

// 성도 경로 (벽 사이 갭을 통과하도록 설계)
const SAINT_WP=[
  {x:120,y:350},{x:580,y:340},{x:980,y:180},{x:1380,y:420},{x:1780,y:240},
  {x:2180,y:380},{x:2580,y:280},{x:3020,y:350},{x:3430,y:350},{x:3820,y:350},
  {x:4250,y:350},{x:4880,y:350}
];
const NUM_SAINTS=10;
const SAINT_SPD=0.22; // 매우 느림 (px/frame @60fps)
const SAINT_R=12;

// 적 타입 (세상의 시험들)
const ETYPES={
  yuhok: {name:'유혹',hp:60, dmg:12,spd:2.2,r:13,xp:5,  col:'#f59e0b',icon:'💸'},
  uisim: {name:'의심',hp:120,dmg:20,spd:1.8,r:16,xp:10, col:'#6366f1',icon:'🌀'},
  gyoman:{name:'교만',hp:280,dmg:35,spd:1.5,r:20,xp:20, col:'#7c3aed',icon:'👑'},
  duryum:{name:'두려움',hp:90,dmg:40,spd:2.6,r:14,xp:12,col:'#dc2626',icon:'😱'},
  hibak: {name:'핍박',hp:180,dmg:25,spd:2.0,r:17,xp:15, col:'#b45309',icon:'⚔️'},
  sesang:{name:'세상',hp:400,dmg:50,spd:1.3,r:23,xp:30, col:'#0891b2',icon:'🌍'},
  guardian:{name:'수문장',hp:999999,dmg:80,spd:1.0,r:28,xp:0,col:'#7f1d1d',icon:'☠️'},
};

// 웨이브 [시작 시간(초), [{type,x,y},...]]
const WAVES=[
  [8,  [{t:'yuhok',x:900,y:80},{t:'yuhok',x:900,y:620},{t:'yuhok',x:1200,y:150},{t:'yuhok',x:1200,y:550}]],
  [50, [{t:'yuhok',x:1500,y:80},{t:'uisim',x:1300,y:350},{t:'yuhok',x:1500,y:620},{t:'uisim',x:1600,y:350}]],
  [110,[{t:'uisim',x:1900,y:100},{t:'gyoman',x:2000,y:350},{t:'uisim',x:1900,y:600},{t:'hibak',x:2200,y:200},{t:'hibak',x:2200,y:500}]],
  [180,[{t:'gyoman',x:2500,y:150},{t:'duryum',x:2600,y:350},{t:'gyoman',x:2500,y:550},{t:'hibak',x:2700,y:100},{t:'hibak',x:2700,y:600}]],
  [260,[{t:'duryum',x:3000,y:80},{t:'sesang',x:3100,y:350},{t:'duryum',x:3000,y:620},{t:'gyoman',x:3200,y:200},{t:'gyoman',x:3200,y:500}]],
  [350,[{t:'sesang',x:3500,y:150},{t:'sesang',x:3500,y:550},{t:'duryum',x:3600,y:350},{t:'gyoman',x:3700,y:100},{t:'gyoman',x:3700,y:600}]],
  [430,[{t:'guardian',x:4600,y:200},{t:'guardian',x:4600,y:500},{t:'guardian',x:4750,y:350},{t:'guardian',x:4650,y:350}]],
];

// 레벨
const LEVELS=[
  {xp:0,  atk:30,spd:3.8,maxHp:100,r:16},
  {xp:40, atk:48,spd:4.1,maxHp:135,r:17},
  {xp:100,atk:72,spd:4.4,maxHp:175,r:18},
  {xp:200,atk:105,spd:4.7,maxHp:220,r:19},
  {xp:340,atk:145,spd:5.0,maxHp:270,r:20},
];

// 벽 (충돌 실제 적용됨)
const WALLS=[
  // 경계
  {x:0,y:0,w:GW,h:22},{x:0,y:678,w:GW,h:22},{x:0,y:0,w:22,h:GH},{x:4978,y:0,w:22,h:GH},
  // 섹션 1 - 유혹의 길 (갭: y=240-440 중앙)
  {x:580,y:22,w:38,h:218},{x:580,y:440,w:38,h:238},
  {x:840,y:22,w:38,h:120},{x:840,y:320,w:38,h:358},
  // 섹션 2 - 의심의 미로 (갭: 교차)
  {x:1100,y:22,w:38,h:280},{x:1100,y:480,w:38,h:198},// 갭 280-480
  {x:1360,y:22,w:38,h:120},{x:1360,y:340,w:38,h:338},// 갭 120-340
  {x:1620,y:180,w:38,h:340},{x:1620,y:600,w:38,h:78}, // 갭 0-180, 520-600
  {x:1880,y:22,w:38,h:240},{x:1880,y:430,w:38,h:248}, // 갭 240-430
  // 섹션 3 - 교만의 광야 (기둥)
  {x:2140,y:22,w:38,h:160},{x:2140,y:430,w:38,h:248}, // 갭 160-430
  {x:2420,y:130,w:40,h:40},{x:2420,y:530,w:40,h:40},
  {x:2680,y:200,w:40,h:40},{x:2680,y:350,w:40,h:40},{x:2680,y:500,w:40,h:40},
  {x:2940,y:130,w:40,h:40},{x:2940,y:530,w:40,h:40},
  // 섹션 4 - 핍박의 좁은 길
  {x:3200,y:22,w:38,h:220},{x:3200,y:460,w:38,h:218},// 갭 220-460
  {x:3460,y:22,w:38,h:100},{x:3460,y:300,w:38,h:378},// 갭 100-300
  {x:3720,y:220,w:38,h:460},                          // 갭 0-220, 위쪽만
  {x:3980,y:22,w:38,h:340},{x:3980,y:500,w:38,h:178},// 갭 340-500
  // 섹션 5 - 최후의 관문
  {x:4240,y:150,w:38,h:400},                          // 갭 0-150, 550-700
  {x:4500,y:22,w:38,h:140},{x:4500,y:400,w:38,h:278},// 갭 140-400
];

// ── 상태 ─────────────────────────────────────────────
let myUid=null,myName='',isGM=false,listenersSetup=false;
let gameActive=false,alive=true,dying=false;
let myX=SPAWN.x,myY=SPAWN.y,myHp=100,myMaxHp=100,myXp=0,myLevel=0,myKills=0;
let pvsActive=false,pvsEnd=0;
let gameStartTime=0;
let allPlayers={},enemyHPs={};
let localEnemies=[],processedWaves=new Set();
let loopId=null,syncId=null,lastFire=0;
let frontier=SPAWN.x; // 전체 플레이어 중 최대 X
let heavenReached=false;
let particles=[];
const STARS=Array.from({length:200},()=>({x:Math.random()*GW,y:Math.random()*GH,r:Math.random()*1.2+.3,a:Math.random()*.25+.05}));

// ── 캔버스/카메라 ─────────────────────────────────────
const canvas=document.getElementById('game-canvas');
const ctx=canvas.getContext('2d');
let W,H,camX=0,camY=0;
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
window.addEventListener('resize',resize);resize();
function updateCam(){camX=Math.max(0,Math.min(GW-W,myX-W/2));camY=Math.max(0,Math.min(GH-H,myY-H/2));}
function ws(wx,wy){return{x:wx-camX,y:wy-camY};}

// ── 벽 충돌 ──────────────────────────────────────────
function collidesWall(x,y,r){
  const pr=r-3; // 약간 여유
  for(const w of WALLS){
    const cx=Math.max(w.x,Math.min(x,w.x+w.w));
    const cy=Math.max(w.y,Math.min(y,w.y+w.h));
    if((x-cx)**2+(y-cy)**2<pr*pr)return true;
  }
  return false;
}
function moveWithSlide(ox,oy,dx,dy,r){
  const nx=ox+dx,ny=oy+dy;
  if(!collidesWall(nx,ny,r))return{x:nx,y:ny};
  if(!collidesWall(nx,oy,r))return{x:nx,y:oy};
  if(!collidesWall(ox,ny,r))return{x:ox,y:ny};
  return{x:ox,y:oy};
}

// ── 조이스틱 ─────────────────────────────────────────
const JOY_R=55;
let jL={id:-1,bx:0,by:0,cx:0,cy:0,active:false};
let jR={id:-1,bx:0,by:0,cx:0,cy:0,active:false};
let lx=0,ly=0,rx=0,ry=0;
function jSt(j,t){j.id=t.identifier;j.bx=t.clientX;j.by=t.clientY;j.cx=t.clientX;j.cy=t.clientY;j.active=true;}
function jMv(j,t){
  if(t.identifier!==j.id)return;
  j.cx=t.clientX;j.cy=t.clientY;
  let dx=j.cx-j.bx,dy=j.cy-j.by,d=Math.hypot(dx,dy);
  if(d>JOY_R){dx=dx/d*JOY_R;dy=dy/d*JOY_R;}
  if(j===jL){lx=dx/JOY_R;ly=dy/JOY_R;}else{rx=dx/JOY_R;ry=dy/JOY_R;}
}
function jEn(j,t){
  if(t.identifier!==j.id)return;
  j.active=false;j.id=-1;
  if(j===jL){lx=0;ly=0;}else{rx=0;ry=0;}
}
document.addEventListener('touchstart',e=>{
  if(!canvas.classList.contains('vis'))return;
  e.preventDefault();
  for(const t of e.changedTouches){if(t.clientX<W/2&&!jL.active)jSt(jL,t);else if(t.clientX>=W/2&&!jR.active)jSt(jR,t);}
},{passive:false});
document.addEventListener('touchmove',e=>{

// ── 성도 위치 (결정론적) ─────────────────────────────
function getSaintPos(idx,elapsedMs){
  const wps=SAINT_WP;
  let totalLen=0;const segLens=[];
  for(let i=1;i<wps.length;i++){const dl=Math.hypot(wps[i].x-wps[i-1].x,wps[i].y-wps[i-1].y);segLens.push(dl);totalLen+=dl;}
  const offset=idx*2500; // 성도들 간 2.5초 간격
  const elapsedSec=Math.max(0,(elapsedMs-offset)/1000);
  const rawDist=elapsedSec*SAINT_SPD*60;
  // 프론티어 제한: 성도가 있을 수 있는 최대 x
  const maxX=heavenReached?HEAVEN.x:frontier;
  // path를 따라 이동하되 maxX 초과 불가
  let rem=rawDist,px=wps[0].x,py=wps[0].y;
  for(let i=0;i<segLens.length;i++){
    const nextX=wps[i+1].x;
    if(nextX>maxX){
      // 이 세그먼트 안에서 maxX까지만
      const t=Math.min(1,(maxX-wps[i].x)/(wps[i+1].x-wps[i].x+0.001));
      const segUsed=Math.min(rem,segLens[i]*t);
      const tt=segUsed/segLens[i];
      px=wps[i].x+(wps[i+1].x-wps[i].x)*tt;
      py=wps[i].y+(wps[i+1].y-wps[i].y)*tt;
      return{x:px,y:py,reached:false};
    }
    if(rem<=segLens[i]){
      const tt=rem/segLens[i];
      return{x:wps[i].x+(wps[i+1].x-wps[i].x)*tt,y:wps[i].y+(wps[i+1].y-wps[i].y)*tt,reached:false};
    }
    px=wps[i+1].x;py=wps[i+1].y;rem-=segLens[i];
  }
  return{x:HEAVEN.x,y:HEAVEN.y,reached:true};
}
function getActiveSaints(){
  if(gameStartTime===0)return[];
  const elapsed=Date.now()-gameStartTime;
  return Array.from({length:NUM_SAINTS},(_,i)=>({idx:i,...getSaintPos(i,elapsed)}));
}

function computeFrontier(){

// ── 적 웨이브 ─────────────────────────────────────────
function processWaves(){
  if(gameStartTime===0)return;
  const elapsed=(Date.now()-gameStartTime)/1000;
  WAVES.forEach(([t,list],wi)=>{
    if(elapsed>=t&&!processedWaves.has(wi)){
      processedWaves.add(wi);
      list.forEach((e,ei)=>{
        const id=`w${wi}e${ei}`;
        if(!localEnemies.find(le=>le.id===id)){
          const et=ETYPES[e.t];
          const hp=enemyHPs[id]??et.hp;
          localEnemies.push({id,type:e.t,x:e.x,y:e.y,hp,maxHp:et.hp,lastAtk:0,lastSaintAtk:0});
          if(enemyHPs[id]===undefined)setDoc(EREF(id),{hp:et.hp,dead:false},{merge:true}).catch(()=>{});
        }
      });
    }
  });
  localEnemies.forEach(e=>{const fbHp=enemyHPs[e.id];if(fbHp!==undefined)e.hp=fbHp;});
  localEnemies=localEnemies.filter(e=>e.hp>0);
}

function updateEnemies(saints){
  const now=Date.now();
  localEnemies.forEach(e=>{
    const et=ETYPES[e.type];
    // 타겟: 가장 가까운 성도 or 플레이어
    let tx=e.x,ty=e.y,nearD=Infinity;
    saints.filter(s=>!s.reached).forEach(s=>{
      const d=Math.hypot(s.x-e.x,s.y-e.y);if(d<nearD){nearD=d;tx=s.x;ty=s.y;}
    });
    // 플레이어가 더 가까우면 우선
    let nearP=null,nearPD=9999;
    Object.values(allPlayers).filter(p=>p.alive).forEach(p=>{
      const d=Math.hypot(p.x-e.x,p.y-e.y);if(d<nearPD){nearPD=d;nearP=p;}
    });
    if(nearP&&nearPD<nearD*0.6&&nearPD<250){tx=nearP.x;ty=nearP.y;nearD=nearPD;}
    const dd=Math.hypot(tx-e.x,ty-e.y);
    if(dd>et.r+12){
      const mv=moveWithSlide(e.x,e.y,(tx-e.x)/dd*et.spd,(ty-e.y)/dd*et.spd,et.r);
      e.x=mv.x;e.y=mv.y;
    }
    // 플레이어 공격
    if(nearP&&nearP.uid===myUid&&nearPD<et.r+LEVELS[myLevel].r+8&&now-e.lastAtk>1600){
      e.lastAtk=now;
      if(pvsActive){return;} // 견인 활성 시 무적
      myHp=Math.max(0,myHp-et.dmg);
      updateDoc(PREF(myUid),{hp:myHp}).catch(()=>{});
      particles.push({x:myX,y:myY,vx:(Math.random()-.5)*4,vy:-2,r:7,life:1,col:'239,68,68'});
      if(myHp<=0&&!dying)die();
    }
  });
}

// ── 발사 ─────────────────────────────────────────────
async function fire(){
  const len=Math.hypot(rx,ry);if(len<.08)return;
  const ndx=rx/len,ndy=ry/len;
  const rng=200+myLevel*30;
  let nearest=null,nearD=rng;
  localEnemies.forEach(e=>{
    const ex=e.x-myX,ey=e.y-myY;
    const proj=ex*ndx+ey*ndy;if(proj<0||proj>nearD)return;
    const perp2=(ex-ndx*proj)**2+(ey-ndy*proj)**2;
    if(perp2<(ETYPES[e.type].r*1.5)**2&&proj<nearD){nearest=e;nearD=proj;}
  });
  if(!nearest)return;
  const atk=LEVELS[myLevel].atk;
  const nh=Math.max(0,nearest.hp-atk);nearest.hp=nh;
  const hx=myX+ndx*nearD,hy=myY+ndy*nearD;
  particles.push({x:hx,y:hy,vx:(Math.random()-.5)*3,vy:-1.5,r:6,life:1,col:'250,204,21'});
  try{
    await updateDoc(EREF(nearest.id),{hp:nh,dead:nh<=0});
    if(nh<=0){myXp+=ETYPES[nearest.type].xp;myKills++;checkLvl();updateDoc(PREF(myUid),{xp:myXp,kills:myKills}).catch(()=>{});}
  }catch(_){}
}

function checkLvl(){
  let nl=0;for(let i=LEVELS.length-1;i>=0;i--){if(myXp>=LEVELS[i].xp){nl=i;break;}}
  if(nl>myLevel){
    myLevel=nl;const lv=LEVELS[myLevel];myMaxHp=lv.maxHp;myHp=Math.min(myHp+40,myMaxHp);
    document.getElementById('lvlup-txt').textContent=`⬆ Lv.${myLevel+1}! 공격력 ${lv.atk}`;
    document.getElementById('lvlup').classList.add('show');
    setTimeout(()=>document.getElementById('lvlup').classList.remove('show'),2200);
    updateDoc(PREF(myUid),{level:myLevel,maxHp:myMaxHp,hp:myHp}).catch(()=>{});
  }
}

async function die(){
  if(!alive||dying)return;
  dying=true;alive=false;gameActive=false;
  document.getElementById('dead-ov').classList.add('vis');
  await updateDoc(PREF(myUid),{alive:false,hp:myMaxHp,x:SPAWN.x,y:SPAWN.y});
  let cnt=Math.ceil(RESPAWN_MS/1000);
  document.getElementById('respawn-cnt').textContent=cnt;
  const iv=setInterval(()=>{cnt--;document.getElementById('respawn-cnt').textContent=Math.max(0,cnt);if(cnt<=0)clearInterval(iv);},1000);
  setTimeout(async()=>{
    alive=true;gameActive=true;dying=false;
    myX=SPAWN.x+(Math.random()-.5)*40;myY=SPAWN.y+(Math.random()-.5)*40;myHp=myMaxHp;
    document.getElementById('dead-ov').classList.remove('vis');
    await updateDoc(PREF(myUid),{alive:true,x:myX,y:myY,hp:myMaxHp});
  },RESPAWN_MS);
}

    const saints=getActiveSaints();const arrived=saints.filter(s=>s.reached).length;
    ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(W-135,H-48,130,43);ctx.strokeStyle='rgba(255,255,255,.1)';ctx.lineWidth=1;ctx.strokeRect(W-135,H-48,130,43);
    ctx.font='bold 9px Noto Sans KR';ctx.textAlign='left';ctx.textBaseline='top';
    ctx.fillStyle='rgba(255,255,255,.6)';ctx.fillText('✝ 성도',W-131,H-45);
    ctx.fillStyle='#4ade80';ctx.fillText(`${arrived}/${NUM_SAINTS}명 천국 도착`,W-131,H-33);
    if(!heavenReached){ctx.fillStyle='#fbbf24';ctx.fillText('먼저 천국에 가라!',W-131,H-21);}
    else{ctx.fillStyle='#93c5fd';ctx.fillText('성도들이 오고 있다!',W-131,H-21);}
  }
  if(pvsActive&&Date.now()<pvsEnd){
    ctx.fillStyle='rgba(250,204,21,.15)';ctx.fillRect(0,44,W,22);
    ctx.fillStyle='rgba(250,204,21,.9)';ctx.font='bold 11px Noto Sans KR';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('✝ 성도의 견인 — 하나님의 손 안에 있다!',W/2,55);
  }
  drawMinimap();
}

function drawMinimap(){
  const mw=130,mh=50,mx=8,my=46;const sx=mw/GW,sy=mh/GH;
  ctx.fillStyle='rgba(0,0,0,.65)';ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=1;ctx.fillRect(mx,my,mw,mh);ctx.strokeRect(mx,my,mw,mh);
  WALLS.forEach(w=>{ctx.fillStyle='rgba(74,222,128,.2)';ctx.fillRect(mx+w.x*sx,my+w.y*sy,Math.max(1,w.w*sx),Math.max(1,w.h*sy));});
  // 천국
  ctx.fillStyle='rgba(250,204,21,.7)';ctx.beginPath();ctx.arc(mx+HEAVEN.x*sx,my+HEAVEN.y*sy,4,0,Math.PI*2);ctx.fill();
  // 성도
  if(gameStartTime>0){getActiveSaints().filter(s=>!s.reached).forEach(s=>{ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.arc(mx+s.x*sx,my+s.y*sy,2,0,Math.PI*2);ctx.fill();});}
  // 적
  localEnemies.forEach(e=>{ctx.fillStyle=ETYPES[e.type].col;ctx.beginPath();ctx.arc(mx+e.x*sx,my+e.y*sy,2,0,Math.PI*2);ctx.fill();});
  // 플레이어들
  Object.values(allPlayers).forEach(p=>{if(!p.alive)return;ctx.fillStyle=p.uid===myUid?'#22d3ee':'#4ade80';ctx.beginPath();ctx.arc(mx+(p._rx||p.x)*sx,my+(p._ry||p.y)*sy,p.uid===myUid?3:2,0,Math.PI*2);ctx.fill();});
  ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=1;ctx.strokeRect(mx+camX*sx,my+camY*sy,W*sx,H*sy);
}

function drawJoys(){
  if(!gameActive||!alive)return;
  function jd(j,defX,defY){
    const bx=j.active?j.bx:defX,by=j.active?j.by:defY;
    let dx=j.active?(j.cx-j.bx):0,dy=j.active?(j.cy-j.by):0;const d=Math.hypot(dx,dy);if(d>JOY_R){dx=dx/d*JOY_R;dy=dy/d*JOY_R;}
    ctx.beginPath();ctx.arc(bx,by,56,0,Math.PI*2);ctx.fillStyle=`rgba(255,255,255,${j.active?.07:.04})`;ctx.fill();ctx.strokeStyle=`rgba(255,255,255,${j.active?.18:.09})`;ctx.lineWidth=1.5;ctx.stroke();
    ctx.strokeStyle=`rgba(255,255,255,${j.active?.08:.04})`;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(bx-52,by);ctx.lineTo(bx+52,by);ctx.stroke();ctx.beginPath();ctx.moveTo(bx,by-52);ctx.lineTo(bx,by+52);ctx.stroke();
    ctx.beginPath();ctx.arc(bx+dx,by+dy,24,0,Math.PI*2);ctx.fillStyle=`rgba(255,255,255,${j.active?.55:.18})`;ctx.fill();ctx.strokeStyle=`rgba(255,255,255,${j.active?.8:.3})`;ctx.lineWidth=2;ctx.stroke();
  }
  jd(jL,100,H-105);jd(jR,W-100,H-105);
  ctx.font='bold 10px Noto Sans KR';ctx.textAlign='center';ctx.textBaseline='top';ctx.fillStyle='rgba(255,255,255,.2)';
  ctx.fillText('이동',100,H-44);ctx.fillText('공격',W-100,H-44);
}

// ── 게임 루프 ─────────────────────────────────────────
function startGameLoop(){
  if(loopId)clearInterval(loopId);
  loopId=setInterval(async()=>{
    if(!gameActive||!alive)return;
    // 이동 (벽 충돌 포함)
    if(Math.abs(lx)>.05||Math.abs(ly)>.05){
      const spd=LEVELS[myLevel].spd;
      const mv=moveWithSlide(myX,myY,lx*spd,ly*spd,LEVELS[myLevel].r);
      myX=Math.max(22,Math.min(GW-22,mv.x));
      myY=Math.max(22,Math.min(GH-22,mv.y));
    }
    // 프론티어 업데이트
    frontier=computeFrontier();
    if(isGM){
      const pct=Math.round((frontier/GW)*100);
      document.getElementById('gm-frontier').textContent=`최전선: ${pct}% (${Math.round(frontier)})`;
    }
    // 천국 도달 체크
    if(!heavenReached&&Math.hypot(myX-HEAVEN.x,myY-HEAVEN.y)<HEAVEN.r+LEVELS[myLevel].r+10){
      heavenReached=true;
      setDoc(STATE,{heavenReached:true},{merge:true}).catch(()=>{});
    }
    // 발사
    if(Math.hypot(rx,ry)>.08){
      const now=Date.now();const cd=Math.max(160,460-myLevel*45);
      if(now-lastFire>cd){lastFire=now;await fire();}
    }
    // 적
    processWaves();
    const saints=getActiveSaints();
    updateEnemies(saints);
    // 성도 전원 도착 체크
    if(heavenReached&&saints.every(s=>s.reached)){
      endGame(true);
    }
    // 시간 종료
    if(gameStartTime>0&&(Date.now()-gameStartTime)/1000>=GAME_DURATION)endGame(false);
  },33);
  if(syncId)clearInterval(syncId);
  // 250ms 동기화 (30명 퍼포먼스)
  syncId=setInterval(()=>{
    if(!alive||!gameActive)return;
    updateDoc(PREF(myUid),{x:Math.round(myX),y:Math.round(myY)}).catch(()=>{});
  },250);
}

function endGame(success){
  if(!gameActive&&!isGM)return;
  gameActive=false;
  if(loopId)clearInterval(loopId);if(syncId)clearInterval(syncId);
  setDoc(STATE,{gameStatus:'ended',success},{merge:true}).catch(()=>{});
  showEnd(success);
}

function showEnd(success){
  document.getElementById('end-tit').textContent=success?'✝ 성도들이 천국에 도착했습니다!':'☠ 시간이 다했습니다';
  document.getElementById('end-tit').style.color=success?'#4ade80':'#ef4444';
  document.getElementById('end-sub').innerHTML=success
    ?'하나님의 손 안에서 아무것도 끊을 수 없었습니다.<br>성도의 견인을 몸으로 경험했습니다!'
    :'더 많은 플레이어가 함께했다면 어땠을까요?<br>성도를 인도하는 것은 혼자가 아니라 함께입니다.';
  go('end');
}

// ── Firebase 리스너 ───────────────────────────────────
function setupListeners(){
  if(listenersSetup)return;listenersSetup=true;
  onSnapshot(STATE,snap=>{
    if(!snap.exists())return;const d=snap.data();const ns=d.gameStatus||'lobby';
    if(d.gameStartTime)gameStartTime=d.gameStartTime;
    if(d.heavenReached)heavenReached=true;
    // 견인
    const nowPvs=d.perseveranceActive||false;
    if(nowPvs&&!pvsActive){
      pvsActive=true;pvsEnd=d.perseveranceEnd||0;
      document.getElementById('pvs-flash').classList.add('show');
      setTimeout(()=>document.getElementById('pvs-flash').classList.remove('show'),2000);
    }
    if(!nowPvs&&pvsActive&&Date.now()>(d.perseveranceEnd||0))pvsActive=false;
    if(ns==='reset'&&!isGM){
      if(loopId)clearInterval(loopId);if(syncId)clearInterval(syncId);listenersSetup=false;
      gameStartTime=0;heavenReached=false;pvsActive=false;
      document.getElementById('name-inp').value='';go('entry');
    } else if(ns==='playing'&&!gameActive&&!isGM&&myName){
      if(!gameStartTime)gameStartTime=Date.now();
      gameActive=true;alive=true;dying=false;localEnemies=[];processedWaves=new Set();
      go('game');startGameLoop();
    } else if(ns==='ended'&&!isGM){
      gameActive=false;showEnd(d.success||false);
    }
  });
  onSnapshot(PCOL,snap=>{
    snap.forEach(docSnap=>{
      const uid=docSnap.id,d=docSnap.data();
      if(!allPlayers[uid])allPlayers[uid]={...d,uid};
      else Object.assign(allPlayers[uid],d,{uid});
      if(uid===myUid&&d.hp!==undefined){
        myHp=d.hp;
        if(d.hp<=0&&d.alive&&alive&&!dying&&!pvsActive)die();
      }
    });
    const uids=new Set(snap.docs.map(d=>d.id));
    Object.keys(allPlayers).forEach(uid=>{if(!uids.has(uid))delete allPlayers[uid];});
    const cnt=snap.docs.length;
    document.getElementById('lobby-cnt').textContent=`${cnt}명 접속 중`;
    document.getElementById('gm-count').textContent=`${cnt}명`;
    renderGMList(snap.docs.map(d=>({uid:d.id,...d.data()})));
  });
  onSnapshot(ECOL,snap=>{snap.forEach(d=>{enemyHPs[d.id]=d.data().hp??0;});});
}

function renderGMList(ps){
  const list=document.getElementById('gm-list');list.innerHTML='';
  ps.slice(0,15).forEach(p=>{
    const div=document.createElement('div');div.className='gm-item';
    div.innerHTML=`<span style="flex:1;font-weight:700;">${p.name||'?'}</span><span style="font-size:.72rem;color:#64748b;">Lv${(p.level||0)+1} ❤${Math.max(0,Math.round(p.hp||0))} K${p.kills||0}</span>`;
    list.appendChild(div);
  });
  if(ps.length>15){const d=document.createElement('div');d.className='gm-item';d.textContent=`... 외 ${ps.length-15}명`;d.style.color='#475569';list.appendChild(d);}
}

function go(id){
  ['entry','lobby','gm','end'].forEach(x=>document.getElementById(x).classList.add('hidden'));
  canvas.classList.remove('vis');document.getElementById('dead-ov').classList.remove('vis');
  if(id==='game')canvas.classList.add('vis');else document.getElementById(id).classList.remove('hidden');
}

// ── GM 액션 ──────────────────────────────────────────
async function activatePVS(){
  const end=Date.now()+PVS_MS;
  await setDoc(STATE,{perseveranceActive:true,perseveranceEnd:end},{merge:true});
  // 수문장 제거
  const es=await getDocs(ECOL);
  const b=writeBatch(db);
  es.forEach(d=>{if(d.data().hp>=999999||localEnemies.find(e=>e.id===d.id&&e.type==='guardian'))b.update(d.ref,{hp:0,dead:true});});
  await b.commit();
  setTimeout(async()=>{await updateDoc(STATE,{perseveranceActive:false}).catch(()=>{});},PVS_MS);
}
async function startGame(){
  const snap=await getDocs(PCOL);const batch=writeBatch(db);const now=Date.now();
  snap.forEach(docSnap=>{const d=docSnap.data();batch.update(docSnap.ref,{alive:true,x:SPAWN.x+(Math.random()-.5)*40,y:SPAWN.y+(Math.random()-.5)*40,hp:LEVELS[0].maxHp,maxHp:LEVELS[0].maxHp,level:0,xp:0,kills:0});});
  await batch.commit();
  const es=await getDocs(ECOL);const eb=writeBatch(db);es.forEach(d=>eb.delete(d.ref));await eb.commit();
  await setDoc(STATE,{gameStatus:'playing',gameStartTime:now,heavenReached:false,success:false,perseveranceActive:false,perseveranceEnd:0});
}
async function replayGame(){await startGame();}
async function resetGame(){
  if(!confirm('초기화합니다.'))return;
  await setDoc(STATE,{gameStatus:'reset',gameStartTime:0,heavenReached:false,perseveranceActive:false,perseveranceEnd:0});
  setTimeout(async()=>{
    const ps=await getDocs(PCOL);const pb=writeBatch(db);ps.forEach(d=>pb.delete(d.ref));await pb.commit();
    const es=await getDocs(ECOL);const eb=writeBatch(db);es.forEach(d=>eb.delete(d.ref));await eb.commit();
    await setDoc(STATE,{gameStatus:'lobby',gameStartTime:0,heavenReached:false,perseveranceActive:false,perseveranceEnd:0});
  },800);
}

// ── 입장 ─────────────────────────────────────────────
async function joinGame(){
  const name=document.getElementById('name-inp').value.trim();
  if(!name){document.getElementById('name-inp').focus();return;}
  myName=name;myMaxHp=LEVELS[0].maxHp;myHp=myMaxHp;myXp=0;myLevel=0;myKills=0;
  myX=SPAWN.x+(Math.random()-.5)*40;myY=SPAWN.y+(Math.random()-.5)*40;
  await setDoc(PREF(myUid),{name:myName,x:Math.round(myX),y:Math.round(myY),hp:myMaxHp,maxHp:myMaxHp,alive:true,level:0,xp:0,kills:0,joinedAt:Date.now()});
  go('lobby');setupListeners();
}

function chkPW(){
  if(document.getElementById('pw-inp').value==='1004'){
    document.getElementById('pw-modal').classList.remove('vis');
    isGM=true;go('gm');setupListeners();
  } else {
    document.getElementById('pw-err').textContent='비밀번호가 틀렸습니다';
    document.getElementById('pw-inp').value='';document.getElementById('pw-inp').focus();
  }
}

// ── 이벤트 리스너 ────────────────────────────────────
document.getElementById('join-btn').addEventListener('click',joinGame);
document.getElementById('name-inp').addEventListener('keypress',e=>{if(e.key==='Enter')joinGame();});
document.getElementById('pvs-btn').addEventListener('click',activatePVS);
document.getElementById('start-btn').addEventListener('click',startGame);
document.getElementById('reset-btn').addEventListener('click',resetGame);
document.getElementById('replay-btn').addEventListener('click',replayGame);
document.getElementById('exit-gm-btn').addEventListener('click',()=>{isGM=false;go('entry');});
document.getElementById('gear').addEventListener('click',()=>{
  document.getElementById('pw-inp').value='';document.getElementById('pw-err').textContent='';
  document.getElementById('pw-modal').classList.add('vis');
  setTimeout(()=>document.getElementById('pw-inp').focus(),100);
});
document.getElementById('pw-ok').addEventListener('click',chkPW);
document.getElementById('pw-cx').addEventListener('click',()=>document.getElementById('pw-modal').classList.remove('vis'));
document.getElementById('pw-inp').addEventListener('keypress',e=>{if(e.key==='Enter')chkPW();});

try{await signInAnonymously(auth);myUid=auth.currentUser.uid;}catch(e){console.error(e);}

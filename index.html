<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>성도의 견인</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:#0a1628;color:white;overflow:hidden;width:100vw;height:100vh;touch-action:none;user-select:none;}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:1.5rem;z-index:50;}
.screen.hidden{display:none;}
#entry{background:linear-gradient(160deg,#0a1628,#0d2040);}
.logo{font-size:3.8rem;font-weight:900;color:#4ade80;text-shadow:0 0 30px rgba(74,222,128,.6);letter-spacing:-2px;line-height:1;}
.logo-sub{font-size:.9rem;color:#334155;font-weight:700;}
.inp{width:100%;max-width:300px;padding:.85rem 1.2rem;font-size:1.2rem;font-family:'Noto Sans KR',sans-serif;background:#1e293b;border:2px solid #334155;border-radius:.9rem;color:white;text-align:center;outline:none;}
.inp:focus{border-color:#4ade80;}
.pick-row{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;width:100%;max-width:300px;}
.pick-btn{padding:.7rem;font-size:.9rem;font-weight:900;font-family:'Noto Sans KR',sans-serif;background:#1e293b;color:#475569;border:2px solid #334155;border-radius:.8rem;cursor:pointer;}
.on-A{background:#1e3a5f!important;color:#93c5fd!important;border-color:#3b82f6!important;}
.on-B{background:#3b1515!important;color:#fca5a5!important;border-color:#ef4444!important;}
.big-btn{width:100%;max-width:300px;padding:1rem;font-size:1.1rem;font-weight:900;font-family:'Noto Sans KR',sans-serif;border:none;border-radius:.9rem;cursor:pointer;}
.btn-green{background:linear-gradient(135deg,#16a34a,#15803d);color:white;}
.btn-blue{background:linear-gradient(135deg,#0ea5e9,#0284c7);color:white;}
.big-btn:active{transform:scale(.97);}
#gear{background:none;border:none;cursor:pointer;color:#1e293b;font-size:1.4rem;padding:.3rem;transition:color .2s,transform .3s;}
#gear:hover{color:#334155;transform:rotate(60deg);}
#pw-modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:300;}
#pw-modal.vis{display:flex;}
.pw-box{background:#1e293b;border:1px solid #334155;border-radius:1.5rem;padding:2rem 1.8rem;width:280px;display:flex;flex-direction:column;gap:1rem;align-items:center;}
.pw-tit{font-size:1rem;font-weight:700;color:#94a3b8;}
#pw-inp{width:100%;padding:.8rem;font-size:1.8rem;font-family:'Noto Sans KR',sans-serif;background:#0f172a;border:2px solid #334155;border-radius:.8rem;color:white;text-align:center;outline:none;letter-spacing:.4em;}
#pw-inp:focus{border-color:#4ade80;}
.pw-row{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;width:100%;}
.pw-ok{padding:.7rem;font-size:1rem;font-weight:900;font-family:'Noto Sans KR',sans-serif;background:#16a34a;color:white;border:none;border-radius:.6rem;cursor:pointer;}
.pw-cx{padding:.7rem;font-size:1rem;font-weight:700;font-family:'Noto Sans KR',sans-serif;background:#1e293b;color:#64748b;border:1px solid #334155;border-radius:.6rem;cursor:pointer;}
#pw-err{font-size:.8rem;color:#ef4444;min-height:.9rem;}
#gm{background:#060e18;z-index:200;justify-content:flex-start;padding:0;overflow-y:auto;align-items:stretch;}
.gmh{padding:1rem 1.5rem;background:#0a1628;border-bottom:1px solid #1e293b;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.gmh-tit{font-size:1.3rem;font-weight:900;color:#4ade80;}
.gm-body{padding:1.2rem;display:flex;flex-direction:column;gap:1.2rem;}
.sec{font-size:.7rem;font-weight:700;color:#475569;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid #1e293b;padding-bottom:.4rem;}
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;}
.stat-card{background:#1e293b;border-radius:.8rem;padding:.8rem;}
.pvs-row{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;}
.pvs-btn{padding:1rem;font-size:1rem;font-weight:900;font-family:'Noto Sans KR',sans-serif;border:none;border-radius:.8rem;cursor:pointer;box-shadow:0 0 20px rgba(250,204,21,.3);}
.pvs-btn:active{transform:scale(.96);}
.act-row{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;}
.sm-btn{padding:.9rem;font-size:1rem;font-weight:900;font-family:'Noto Sans KR',sans-serif;border:none;border-radius:.8rem;cursor:pointer;}
.sm-btn:active{transform:scale(.97);}
.gm-list{display:flex;flex-direction:column;gap:.35rem;max-height:180px;overflow-y:auto;}
.gm-item{display:flex;align-items:center;gap:.5rem;padding:.4rem .7rem;background:#1e293b;border-radius:.5rem;font-size:.82rem;}
.gm-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
#lobby{background:linear-gradient(160deg,#0a1628,#0d2040);}
.lobby-badge{padding:.5rem 1.5rem;border-radius:2rem;font-size:1rem;font-weight:900;}
#game-canvas{position:fixed;inset:0;width:100%;height:100%;display:none;z-index:10;}
#game-canvas.vis{display:block;}
#dead-ov{position:fixed;inset:0;z-index:110;background:rgba(0,0,0,.87);display:none;flex-direction:column;align-items:center;justify-content:center;gap:1rem;font-family:'Noto Sans KR',sans-serif;color:white;}
#dead-ov.vis{display:flex;}
#lvlup{position:fixed;top:18%;left:50%;transform:translateX(-50%);z-index:120;background:rgba(250,204,21,.15);border:2px solid rgba(250,204,21,.5);border-radius:1rem;padding:.8rem 2rem;text-align:center;display:none;font-family:'Noto Sans KR',sans-serif;}
#lvlup.show{display:block;animation:lvA 2.2s ease forwards;}
@keyframes lvA{0%{opacity:0;transform:translateX(-50%) scale(.8)}15%{opacity:1;transform:translateX(-50%) scale(1.1)}75%{opacity:1;transform:translateX(-50%) scale(1)}100%{opacity:0;transform:translateX(-50%) translateY(-30px)}}
#end{background:radial-gradient(circle,#071a0a,#000);}
.end-tit{font-size:2.5rem;font-weight:900;text-align:center;}
.end-sub{font-size:1rem;color:rgba(255,255,255,.7);text-align:center;line-height:1.7;}
.end-verse{padding:1rem 1.5rem;border:1px solid rgba(74,222,128,.25);border-radius:1rem;background:rgba(74,222,128,.07);font-size:.9rem;color:#bbf7d0;text-align:center;line-height:1.6;}
</style>
</head>
<body>

        <div style="font-size:.7rem;color:#64748b;" id="gm-B-saints">성도 0/5 도착</div>
      </div>
    </div>
    <div class="stat-card" style="text-align:center;">
      <div style="font-size:.75rem;color:#64748b;margin-bottom:.3rem;">남은 시간</div>
      <div style="font-size:2rem;font-weight:900;color:#fbbf24;" id="gm-timer">8:00</div>
    </div>
    <div class="sec">✝ 성도의 견인 발동</div>
    <div class="pvs-row">
      <button class="pvs-btn" id="pvs-a" style="background:linear-gradient(135deg,#854d0e,#713f12);color:#fde68a;">✝ 팀A 견인</button>
      <button class="pvs-btn" id="pvs-b" style="background:linear-gradient(135deg,#78350f,#92400e);color:#fde68a;">✝ 팀B 견인</button>
    </div>
    <div class="sec">게임 제어</div>
    <div class="act-row">
      <button class="sm-btn btn-green" id="start-btn">▶ 게임 시작</button>
      <button class="sm-btn" id="reset-btn" style="background:#1e293b;color:#64748b;border:1px solid #334155;">↺ 초기화</button>
    </div>
    <button class="sm-btn btn-blue" id="replay-btn" style="width:100%;">🔄 다시하기</button>
    <div class="sec">접속 현황</div>
    <div class="gm-list" id="gm-list"></div>
  </div>
</div>
<div id="lobby" class="screen hidden">
  <div style="font-size:3rem;">⚔</div>
  <div style="font-size:2rem;font-weight:900;color:#4ade80;">성도의 견인</div>
  <div class="lobby-badge" id="lobby-badge"></div>

  <div id="lobby-cnt" style="font-size:.8rem;color:#1e293b;"></div>
</div>
<div id="dead-ov">
  <div style="font-size:3.5rem;">☠</div>
  <div style="font-size:1.8rem;font-weight:900;color:#ef4444;">전사했습니다</div>
  <div style="font-size:.95rem;color:#94a3b8;text-align:center;">출발선으로 돌아갑니다</div>
  <div id="respawn-cnt" style="font-size:3rem;font-weight:900;color:#fbbf24;">5</div>
</div>
<div id="lvlup"><div style="font-size:1.2rem;font-weight:900;color:#facc15;" id="lvlup-txt">레벨 업!</div></div>
<div id="end" class="screen hidden">
  <div id="end-tit" class="end-tit"></div>
  <div id="end-sub" class="end-sub"></div>
  <div class="end-verse">
    "내가 그들에게 영생을 주노니 영원히 멸망하지 아니할 것이요<br>
    또 그들을 내 손에서 빼앗을 자가 없느니라"<br>
    <span style="font-size:.8rem;color:#86efac;">— 요한복음 10:28</span>
  </div>
</div>

  [45, [{t:'skeleton',x:500,y:0},{t:'demon',x:800,y:0},{t:'skeleton',x:700,y:GH},{t:'demon',x:1100,y:GH},{t:'demon',x:3200,y:0},{t:'skeleton',x:3500,y:0},{t:'demon',x:2800,y:GH},{t:'skeleton',x:3100,y:GH}]],
  [95, [{t:'demon',x:600,y:0},{t:'giant',x:900,y:0},{t:'demon',x:800,y:GH},{t:'giant',x:1100,y:GH},{t:'giant',x:3100,y:0},{t:'demon',x:3400,y:0},{t:'giant',x:2900,y:GH},{t:'demon',x:3200,y:GH}]],
  [160,[{t:'giant',x:700,y:0},{t:'demon',x:1000,y:0},{t:'giant',x:1300,y:0},{t:'giant',x:900,y:GH},{t:'demon',x:600,y:GH},{t:'giant',x:3300,y:0},{t:'giant',x:3100,y:0},{t:'demon',x:2700,y:GH},{t:'giant',x:2900,y:GH}]],
  [235,[{t:'boss',x:800,y:0},{t:'giant',x:600,y:GH},{t:'giant',x:1200,y:0},{t:'demon',x:1000,y:GH},{t:'boss',x:3200,y:0},{t:'giant',x:3400,y:GH},{t:'giant',x:3000,y:0},{t:'demon',x:2800,y:GH}]],

  {x:0,y:0,w:GW,h:25},{x:0,y:GH-25,w:GW,h:25},{x:0,y:0,w:25,h:GH},{x:GW-25,y:0,w:25,h:GH},
  {x:470,y:25,w:35,h:160},{x:470,y:245,w:35,h:155},{x:470,y:460,w:35,h:20},{x:470,y:540,w:35,h:195},{x:470,y:790,w:35,h:85},
  {x:830,y:25,w:35,h:75},{x:830,y:160,w:35,h:195},{x:830,y:420,w:35,h:55},{x:830,y:540,w:35,h:180},{x:830,y:790,w:35,h:85},

// CANVAS / CAMERA
const canvas=document.getElementById('game-canvas');
const ctx=canvas.getContext('2d');
let W,H,camX=0,camY=0;

function updateCam(){camX=Math.max(0,Math.min(GW-W,myX-W/2));camY=Math.max(0,Math.min(GH-H,myY-H/2));}
function ws(wx,wy){return{x:wx-camX,y:wy-camY};}

// JOYSTICK
const JR=55;
let jL={id:-1,bx:0,by:0,cx:0,cy:0,active:false},jR2={id:-1,bx:0,by:0,cx:0,cy:0,active:false};
let lx=0,ly=0,rx=0,ry=0;
function jSt(j,t){j.id=t.identifier;j.bx=t.clientX;j.by=t.clientY;j.cx=t.clientX;j.cy=t.clientY;j.active=true;}
function jMv(j,t){if(t.identifier!==j.id)return;j.cx=t.clientX;j.cy=t.clientY;let dx=j.cx-j.bx,dy=j.cy-j.by,d=Math.hypot(dx,dy);if(d>JR){dx=dx/d*JR;dy=dy/d*JR;}if(j===jL){lx=dx/JR;ly=dy/JR;}else{rx=dx/JR;ry=dy/JR;}}
function jEn(j,t){if(t.identifier!==j.id)return;j.active=false;j.id=-1;if(j===jL){lx=0;ly=0;}else{rx=0;ry=0;}}
document.addEventListener('touchstart',e=>{

// SAINT POSITION (deterministic)
function getSaintPos(team,idx,elapsedMs){
  const wps=SAINT_WP[team];
  const sId=team+idx;
  const hp=saintHPs[sId]??SAINT_MAX_HP;
  if(hp<=0)return{x:wps[0].x,y:wps[0].y,dead:true,reached:false};
  let totalLen=0;const segLens=[];
  for(let i=1;i<wps.length;i++){const dl=Math.hypot(wps[i].x-wps[i-1].x,wps[i].y-wps[i-1].y);segLens.push(dl);totalLen+=dl;}
  const offset=idx*20;
  const elapsedSec=Math.max(0,(elapsedMs-offset*1000/20)/1000);
  const dist=Math.min(elapsedSec*SAINT_SPD*60,totalLen);
  if(dist>=totalLen)return{x:wps[wps.length-1].x,y:wps[wps.length-1].y,dead:false,reached:true};
  let rem=dist;
  for(let i=0;i<segLens.length;i++){
    if(rem<=segLens[i]){const t=rem/segLens[i];return{x:wps[i].x+(wps[i+1].x-wps[i].x)*t,y:wps[i].y+(wps[i+1].y-wps[i].y)*t,dead:false,reached:false};}
    rem-=segLens[i];
  }
  return{x:wps[wps.length-1].x,y:wps[wps.length-1].y,dead:false,reached:true};
}
function getActiveSaints(){
  if(!gameActive||gameStartTime===0)return[];
  const elapsed=Date.now()-gameStartTime;const saints=[];
  for(const team of['A','B'])for(let i=0;i<NUM_SAINTS;i++){const s=getSaintPos(team,i,elapsed);saints.push({id:team+i,team,idx:i,...s});}
  return saints;
}

// WAVE PROCESSING
function processWaves(){
  if(!gameActive||gameStartTime===0)return;
  const elapsed=(Date.now()-gameStartTime)/1000;
  WAVES.forEach(([t,list],wi)=>{
    if(elapsed>=t&&!processedWaves.has(wi)){
      processedWaves.add(wi);
      list.forEach((e,ei)=>{
        const id=`w${wi}e${ei}`;
        if(!localEnemies.find(le=>le.id===id)){
          const et=ETYPES[e.t];
          localEnemies.push({id,type:e.t,x:e.x,y:e.y,hp:enemyHPs[id]??et.hp,maxHp:et.hp,lastAtk:0,lastSaintAtk:0});
          setDoc(EREF(id),{hp:et.hp,dead:false},{merge:true}).catch(()=>{});
        }
      });
    }
  });
  localEnemies.forEach(e=>{const fbHp=enemyHPs[e.id];if(fbHp!==undefined)e.hp=fbHp;});
  localEnemies=localEnemies.filter(e=>e.hp>0);
}

function updateEnemies(saints){
  const now=Date.now();
  localEnemies.forEach(e=>{
    const et=ETYPES[e.type];
    let nearSaint=null,nearSD=Infinity;
    saints.filter(s=>!s.dead&&!s.reached).forEach(s=>{const d=Math.hypot(s.x-e.x,s.y-e.y);if(d<nearSD){nearSD=d;nearSaint=s;}});
    let nearP=null,nearPD=Infinity;
    Object.values(allPlayers).filter(p=>p.alive).forEach(p=>{const d=Math.hypot(p.x-e.x,p.y-e.y);if(d<nearPD){nearPD=d;nearP=p;}});
    let tx=e.x,ty=e.y;
    if(nearP&&nearPD<nearSD*0.65&&nearPD<280){tx=nearP.x;ty=nearP.y;}
    else if(nearSaint){tx=nearSaint.x;ty=nearSaint.y;}else return;
    const dd=Math.hypot(tx-e.x,ty-e.y);
    if(dd>et.r+12){e.x+=(tx-e.x)/dd*et.spd;e.y+=(ty-e.y)/dd*et.spd;}
    // 성도 공격
    if(nearSaint&&Math.hypot(nearSaint.x-e.x,nearSaint.y-e.y)<et.r+15&&now-e.lastSaintAtk>1800){
      e.lastSaintAtk=now;
      const cur=saintHPs[nearSaint.id]??SAINT_MAX_HP;
      if(cur>0){
        const nh=Math.max(0,cur-et.dmg);saintHPs[nearSaint.id]=nh;
        setDoc(SREF(nearSaint.id),{hp:nh,maxHp:SAINT_MAX_HP},{merge:true}).catch(()=>{});
        particles.push({x:nearSaint.x,y:nearSaint.y,vx:(Math.random()-.5)*3,vy:-2,r:5,life:1,col:'255,255,255'});
      }
    }
    // 플레이어 공격
    if(nearP&&nearP.uid===myUid&&nearPD<et.r+LEVELS[myLevel].r+8&&now-e.lastAtk>1500){
      e.lastAtk=now;
      if(!(pvsActive&&pvsTeam===myTeam)){
        myHp=Math.max(0,myHp-et.dmg);
        updateDoc(PREF(myUid),{hp:myHp}).catch(()=>{});
        particles.push({x:myX,y:myY,vx:(Math.random()-.5)*4,vy:-2,r:7,life:1,col:'239,68,68'});
        if(myHp<=0&&!dying)die();
      }
    }
  });
}

async function fire(){
  const len=Math.hypot(rx,ry);if(len<.08)return;
  const ndx=rx/len,ndy=ry/len;
  const rng=LEVELS[myLevel].atk*4.5;
  let nearest=null,nearD=rng;
  localEnemies.forEach(e=>{
    const ex=e.x-myX,ey=e.y-myY;
    const proj=ex*ndx+ey*ndy;if(proj<0||proj>nearD)return;
    const perp2=(ex-ndx*proj)**2+(ey-ndy*proj)**2;
    if(perp2<(ETYPES[e.type].r*1.4)**2&&proj<nearD){nearest=e;nearD=proj;}
  });
  if(!nearest)return;
  const nh=Math.max(0,nearest.hp-LEVELS[myLevel].atk);
  nearest.hp=nh;
  const hx=myX+ndx*nearD,hy=myY+ndy*nearD;
  const ec=ETYPES[nearest.type].col;
  particles.push({x:hx,y:hy,vx:(Math.random()-.5)*3,vy:-1.5,r:6,life:1,col:ec.slice(1).match(/../g).map(h=>parseInt(h,16)).join(',')});
  try{
    await updateDoc(EREF(nearest.id),{hp:nh,dead:nh<=0});
    if(nh<=0){myXp+=ETYPES[nearest.type].xp;myKills++;checkLvl();updateDoc(PREF(myUid),{xp:myXp,kills:myKills}).catch(()=>{});}
  }catch(_){}
}

function checkLvl(){
  let nl=0;for(let i=LEVELS.length-1;i>=0;i--){if(myXp>=LEVELS[i].xp){nl=i;break;}}
  if(nl>myLevel){
    myLevel=nl;myMaxHp=LEVELS[myLevel].maxHp;myHp=Math.min(myHp+30,myMaxHp);
    document.getElementById('lvlup-txt').textContent=`⬆ Lv.${myLevel+1}! ATK ${LEVELS[myLevel].atk} SPD ${LEVELS[myLevel].spd}`;
    document.getElementById('lvlup').classList.add('show');
    setTimeout(()=>document.getElementById('lvlup').classList.remove('show'),2200);
    updateDoc(PREF(myUid),{level:myLevel,maxHp:myMaxHp,hp:myHp}).catch(()=>{});
  }
}

async function die(){
  if(!alive||dying)return;
  dying=true;alive=false;gameActive=false;
  document.getElementById('dead-ov').classList.add('vis');
  const sp={x:SPAWN[myTeam].x+(Math.random()-.5)*60,y:SPAWN[myTeam].y+(Math.random()-.5)*60};
  await updateDoc(PREF(myUid),{alive:false,hp:myMaxHp,x:sp.x,y:sp.y});
  let cnt=Math.ceil(RESPAWN_MS/1000);
  document.getElementById('respawn-cnt').textContent=cnt;
  const iv=setInterval(()=>{cnt--;document.getElementById('respawn-cnt').textContent=Math.max(0,cnt);if(cnt<=0)clearInterval(iv);},1000);
  setTimeout(async()=>{alive=true;gameActive=true;dying=false;myX=sp.x;myY=sp.y;myHp=myMaxHp;document.getElementById('dead-ov').classList.remove('vis');await updateDoc(PREF(myUid),{alive:true,x:myX,y:myY,hp:myMaxHp});},RESPAWN_MS);
}

function drawHeaven(ts){
  const dist=Math.hypot(myX-HEAVEN.x,myY-HEAVEN.y);
  const FULL=90,FADE=300;
  const v=dist<FULL?1:dist>FADE?0:1-(dist-FULL)/(FADE-FULL);
  if(v<=0)return;
  const p=ws(HEAVEN.x,HEAVEN.y);const hr=HEAVEN.r;const pulse=.7+Math.sin(ts/500)*.3;
  const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,hr*3.5);
  g.addColorStop(0,`rgba(250,204,21,${.25*pulse*v})`);g.addColorStop(1,'rgba(250,204,21,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,hr*3.5,0,Math.PI*2);ctx.fill();
  const w=(ts/800)%1;
  ctx.strokeStyle=`rgba(250,204,21,${(.4-w*.4)*v})`;ctx.lineWidth=2;ctx.shadowBlur=15*v;ctx.shadowColor='#facc15';
  ctx.beginPath();ctx.arc(p.x,p.y,hr*.8+w*hr*2.8,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;
  ctx.fillStyle=`rgba(250,204,21,${(.15+.04*pulse)*v})`;ctx.strokeStyle=`rgba(250,204,21,${.9*pulse*v})`;ctx.lineWidth=2.5;
  ctx.shadowBlur=28*v;ctx.shadowColor='#facc15';ctx.beginPath();ctx.arc(p.x,p.y,hr,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.shadowBlur=0;
  if(v>0.4){const tv=(v-.4)/.6;ctx.font=`bold ${hr*.85}px sans-serif`;ctx.fillStyle=`rgba(250,204,21,${pulse*tv})`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowBlur=8;ctx.shadowColor='#facc15';ctx.fillText('✝',p.x,p.y);ctx.shadowBlur=0;ctx.font='bold 12px Noto Sans KR';ctx.fillStyle=`rgba(250,204,21,${.8*pulse*tv})`;ctx.textBaseline='top';ctx.fillText('천 국',p.x,p.y+hr+5);}
}

  // 성도 현황
  if(gameActive){
    const saints=getActiveSaints().filter(s=>s.team===myTeam);
    const reached=saints.filter(s=>s.reached).length;
    const alive2=saints.filter(s=>!s.reached&&!s.dead).length;
    ctx.fillStyle='rgba(0,0,0,.52)';ctx.fillRect(W-115,H-48,110,43);
    ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=1;ctx.strokeRect(W-115,H-48,110,43);
    ctx.font='bold 9px Noto Sans KR';ctx.textAlign='left';ctx.textBaseline='top';
    ctx.fillStyle='rgba(255,255,255,.65)';ctx.fillText('✝ 우리팀 성도',W-111,H-45);
    ctx.fillStyle='#4ade80';ctx.fillText(`${reached}명 천국 도착`,W-111,H-33);
    ctx.fillStyle='#93c5fd';ctx.fillText(`${alive2}명 이동 중`,W-111,H-21);
    // GM 업데이트
    if(isGM){
      const sA=getActiveSaints().filter(s=>s.team==='A');const sB=getActiveSaints().filter(s=>s.team==='B');
      document.getElementById('gm-A-saints').textContent=`성도 ${sA.filter(s=>s.reached).length}/5 도착`;
      document.getElementById('gm-B-saints').textContent=`성도 ${sB.filter(s=>s.reached).length}/5 도착`;
    }
  }
  if(pvsActive&&pvsTeam===myTeam){ctx.fillStyle='rgba(250,204,21,.12)';ctx.fillRect(0,44,W,22);ctx.fillStyle='rgba(250,204,21,.9)';ctx.font='bold 11px Noto Sans KR';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('✝ 성도의 견인 — 무적!',W/2,55);}
  drawMinimap();
}

function drawMinimap(){
  const mw=128,mh=65,mx=W-mw-6,my=46;const sx=mw/GW,sy=mh/GH;
  ctx.fillStyle='rgba(0,0,0,.65)';ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=1;ctx.fillRect(mx,my,mw,mh);ctx.strokeRect(mx,my,mw,mh);
  WALLS.forEach(w=>{ctx.fillStyle='rgba(74,222,128,.18)';ctx.fillRect(mx+w.x*sx,my+w.y*sy,Math.max(1,w.w*sx),Math.max(1,w.h*sy));});
  if(gameActive){
    getActiveSaints().filter(s=>!s.dead&&!s.reached).forEach(s=>{ctx.fillStyle=s.team==='A'?'rgba(255,255,255,.75)':'rgba(255,240,150,.75)';ctx.beginPath();ctx.arc(mx+s.x*sx,my+s.y*sy,2.5,0,Math.PI*2);ctx.fill();});
    localEnemies.forEach(e=>{ctx.fillStyle=ETYPES[e.type].col;ctx.beginPath();ctx.arc(mx+e.x*sx,my+e.y*sy,2,0,Math.PI*2);ctx.fill();});
  }
  Object.values(allPlayers).forEach(p=>{if(!p.alive)return;ctx.fillStyle=p.uid===myUid?'white':(p.team==='A'?'#93c5fd':'#fca5a5');ctx.beginPath();ctx.arc(mx+(p._rx||p.x)*sx,my+(p._ry||p.y)*sy,p.uid===myUid?3.5:2.5,0,Math.PI*2);ctx.fill();});
  ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=1;ctx.strokeRect(mx+camX*sx,my+camY*sy,W*sx,H*sy);
}

function drawJoys(){
  if(!gameActive||!alive)return;
  function jd(j,defX,defY,col){
    const bx=j.active?j.bx:defX,by=j.active?j.by:defY;
    let dx=j.active?(j.cx-j.bx):0,dy=j.active?(j.cy-j.by):0;const d=Math.hypot(dx,dy);if(d>JR){dx=dx/d*JR;dy=dy/d*JR;}
    ctx.beginPath();ctx.arc(bx,by,58,0,Math.PI*2);ctx.fillStyle=`rgba(255,255,255,${j.active?.07:.04})`;ctx.fill();ctx.strokeStyle=`rgba(255,255,255,${j.active?.18:.09})`;ctx.lineWidth=1.5;ctx.stroke();
    ctx.strokeStyle=`rgba(255,255,255,${j.active?.08:.04})`;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(bx-54,by);ctx.lineTo(bx+54,by);ctx.stroke();ctx.beginPath();ctx.moveTo(bx,by-54);ctx.lineTo(bx,by+54);ctx.stroke();
    ctx.beginPath();ctx.arc(bx+dx,by+dy,25,0,Math.PI*2);ctx.fillStyle=`rgba(${col},${j.active?.55:.18})`;ctx.fill();ctx.strokeStyle=`rgba(${col},${j.active?.8:.3})`;ctx.lineWidth=2;ctx.stroke();
  }
  jd(jL,100,H-105,'255,255,255');jd(jR2,W-100,H-105,myTeam==='A'?'147,197,253':'252,165,165');
  ctx.font='bold 10px Noto Sans KR';ctx.textAlign='center';ctx.textBaseline='top';ctx.fillStyle='rgba(255,255,255,.2)';
  ctx.fillText('이동',100,H-44);ctx.fillText('공격',W-100,H-44);
}

// GAME LOOP
function startGameLoop(){
  if(loopId)clearInterval(loopId);
  loopId=setInterval(async()=>{
    if(!gameActive||!alive)return;
    const spd=LEVELS[myLevel].spd;
    if(Math.abs(lx)>.05||Math.abs(ly)>.05){myX=Math.max(25,Math.min(GW-25,myX+lx*spd));myY=Math.max(25,Math.min(GH-25,myY+ly*spd));}
    if(Math.hypot(rx,ry)>.08){const now=Date.now();const cd=Math.max(170,450-myLevel*42);if(now-lastFire>cd){lastFire=now;await fire();}}
    const saints=getActiveSaints();
    processWaves();updateEnemies(saints);
    if(gameStartTime>0&&(Date.now()-gameStartTime)/1000>=GAME_DURATION)endGame();
  },33);
  if(syncId)clearInterval(syncId);
  syncId=setInterval(()=>{if(!alive||!gameActive)return;updateDoc(PREF(myUid),{x:myX,y:myY}).catch(()=>{});},150);
}

function endGame(){
  if(!gameActive)return;gameActive=false;
  if(loopId)clearInterval(loopId);if(syncId)clearInterval(syncId);
  const saints=getActiveSaints();
  const arrivedA=saints.filter(s=>s.team==='A'&&s.reached).length;
  const arrivedB=saints.filter(s=>s.team==='B'&&s.reached).length;
  const winner=arrivedA>arrivedB?'A':arrivedB>arrivedA?'B':'draw';
  setDoc(STATE,{gameStatus:'ended',winner,arrivedA,arrivedB},{merge:true}).catch(()=>{});
  showEnd(winner,arrivedA,arrivedB);
}

function showEnd(winner,aA,aB){
  const iW=winner===myTeam||(winner==='draw');
  document.getElementById('end-tit').textContent=winner==='draw'?'⚔ 무승부!':iW?'✝ 승리!':'☠ 패배했습니다';
  document.getElementById('end-tit').style.color=winner==='draw'?'#fbbf24':iW?'#4ade80':'#ef4444';
  document.getElementById('end-sub').innerHTML=`팀 A: ${aA||0}명 천국 도착 | 팀 B: ${aB||0}명 천국 도착<br>${winner==='draw'?'동점!':winner==='A'?'팀 A 승리!':'팀 B 승리!'}`;
  go('end');
}

// FIREBASE LISTENERS
function setupListeners(){
  if(listenersSetup)return;listenersSetup=true;
  onSnapshot(STATE,snap=>{
    if(!snap.exists())return;const d=snap.data();const ns=d.gameStatus||'lobby';
    pvsActive=d.perseveranceActive||false;pvsTeam=d.perseveranceTeam||null;pvsEnd=d.perseveranceEnd||0;
    if(pvsActive&&Date.now()>pvsEnd)pvsActive=false;
    if(d.gameStartTime)gameStartTime=d.gameStartTime;
    if(ns==='reset'&&!isGM){if(loopId)clearInterval(loopId);if(syncId)clearInterval(syncId);listenersSetup=false;document.getElementById('name-inp').value='';go('entry');}
    else if(ns==='playing'&&!gameActive&&!isGM&&myTeam){gameActive=true;alive=true;dying=false;localEnemies=[];processedWaves=new Set();go('game');startGameLoop();}
    else if(ns==='lobby'&&gameActive&&!isGM){gameActive=false;if(loopId)clearInterval(loopId);if(syncId)clearInterval(syncId);go('lobby');}
    else if(d.winner&&ns==='ended'&&!isGM){gameActive=false;showEnd(d.winner,d.arrivedA||0,d.arrivedB||0);}
  });
  onSnapshot(PCOL,snap=>{
    const cnt={A:0,B:0};
    snap.forEach(docSnap=>{
      const uid=docSnap.id,d=docSnap.data();
      if(!allPlayers[uid])allPlayers[uid]={...d,uid};else Object.assign(allPlayers[uid],d,{uid});
      if(uid===myUid&&d.hp!==undefined){myHp=d.hp;if(d.hp<=0&&d.alive&&alive&&!dying){if(!(pvsActive&&pvsTeam===myTeam))die();else updateDoc(PREF(myUid),{hp:myMaxHp}).catch(()=>{});}}
      const t=d.team;if(t)cnt[t]++;
    });
    const uids=new Set(snap.docs.map(d=>d.id));Object.keys(allPlayers).forEach(uid=>{if(!uids.has(uid))delete allPlayers[uid];});
    document.getElementById('gm-A').textContent=`${cnt.A}명`;document.getElementById('gm-B').textContent=`${cnt.B}명`;
    renderGMList(snap.docs.map(d=>({uid:d.id,...d.data()})));
    document.getElementById('lobby-cnt').textContent=`🔵 A: ${cnt.A}명 | 🔴 B: ${cnt.B}명`;
  });
  onSnapshot(ECOL,snap=>{snap.forEach(d=>{enemyHPs[d.id]=d.data().hp??0;});});
  onSnapshot(SCOL,snap=>{snap.forEach(d=>{saintHPs[d.id]=d.data().hp??SAINT_MAX_HP;});});
}

function renderGMList(players){
  const list=document.getElementById('gm-list');list.innerHTML='';
  players.forEach(p=>{
    const col=p.team==='A'?'#93c5fd':'#fca5a5';const div=document.createElement('div');div.className='gm-item';
    div.innerHTML=`<div class="gm-dot" style="background:${col}"></div><span style="flex:1;font-weight:700;">${p.name||'?'}</span><span style="font-size:.72rem;color:#64748b;">Lv${(p.level||0)+1} ❤${Math.max(0,Math.round(p.hp||0))} K${p.kills||0}</span>`;
    list.appendChild(div);
  });
}

function go(id){
  ['entry','lobby','gm','end'].forEach(x=>document.getElementById(x).classList.add('hidden'));
  canvas.classList.remove('vis');document.getElementById('dead-ov').classList.remove('vis');
  if(id==='game')canvas.classList.add('vis');else document.getElementById(id).classList.remove('hidden');
}

// GM ACTIONS
async function activatePVS(team){
  await setDoc(STATE,{perseveranceActive:true,perseveranceTeam:team,perseveranceEnd:Date.now()+PVS_MS,gameStatus:'playing'},{merge:true});
  setTimeout(async()=>{await updateDoc(STATE,{perseveranceActive:false,perseveranceTeam:null}).catch(()=>{});},PVS_MS);
}
async function startGame(){
  const snap=await getDocs(PCOL);const batch=writeBatch(db);const now=Date.now();
  snap.forEach(docSnap=>{const d=docSnap.data();const sp=SPAWN[d.team]||SPAWN.A;batch.update(docSnap.ref,{alive:true,x:sp.x+(Math.random()-.5)*60,y:sp.y+(Math.random()-.5)*60,hp:LEVELS[0].maxHp,maxHp:LEVELS[0].maxHp,level:0,xp:0,kills:0,respawnAt:0});});
  await batch.commit();
  const es=await getDocs(ECOL);const eb=writeBatch(db);es.forEach(d=>eb.delete(d.ref));await eb.commit();
  const ss=await getDocs(SCOL);const sb=writeBatch(db);ss.forEach(d=>sb.delete(d.ref));await sb.commit();
  await setDoc(STATE,{gameStatus:'playing',winner:null,gameStartTime:now,perseveranceActive:false,perseveranceTeam:null,perseveranceEnd:0,arrivedA:0,arrivedB:0});
}
async function replayGame(){await startGame();}
async function resetGame(){
  if(!confirm('모든 플레이어를 퇴장시킵니다.'))return;
  await setDoc(STATE,{gameStatus:'reset',winner:null,gameStartTime:0,perseveranceActive:false,perseveranceTeam:null,perseveranceEnd:0});
  setTimeout(async()=>{
    const ps=await getDocs(PCOL);const pb=writeBatch(db);ps.forEach(d=>pb.delete(d.ref));await pb.commit();
    const es=await getDocs(ECOL);const eb=writeBatch(db);es.forEach(d=>eb.delete(d.ref));await eb.commit();
    const ss=await getDocs(SCOL);const sb=writeBatch(db);ss.forEach(d=>sb.delete(d.ref));await sb.commit();
    await setDoc(STATE,{gameStatus:'lobby',winner:null,gameStartTime:0,perseveranceActive:false,perseveranceTeam:null,perseveranceEnd:0});
  },800);
}

function pick(team){selectedTeam=team;document.getElementById('btn-A').className='pick-btn'+(team==='A'?' on-A':'');document.getElementById('btn-B').className='pick-btn'+(team==='B'?' on-B':'');}

async function joinGame(){
  const name=document.getElementById('name-inp').value.trim();if(!name){document.getElementById('name-inp').focus();return;}if(!selectedTeam){alert('팀을 선택해주세요!');return;}
  myName=name;myTeam=selectedTeam;myMaxHp=LEVELS[0].maxHp;myHp=myMaxHp;myXp=0;myLevel=0;myKills=0;
  const sp=SPAWN[myTeam];myX=sp.x+(Math.random()-.5)*60;myY=sp.y+(Math.random()-.5)*60;
  await setDoc(PREF(myUid),{name:myName,team:myTeam,x:myX,y:myY,hp:myMaxHp,maxHp:myMaxHp,alive:true,level:0,xp:0,kills:0,respawnAt:0,joinedAt:Date.now()});
  const tc=myTeam==='A'?'#93c5fd':'#fca5a5';const tl=myTeam==='A'?'🔵 팀 A':'🔴 팀 B';
  const badge=document.getElementById('lobby-badge');badge.textContent=tl;badge.style.color=tc;badge.style.background=myTeam==='A'?'rgba(59,130,246,.15)':'rgba(239,68,68,.15)';badge.style.border=`2px solid ${myTeam==='A'?'#3b82f6':'#ef4444'}`;
  go('lobby');setupListeners();
}

function chkPW(){
  if(document.getElementById('pw-inp').value==='1004'){document.getElementById('pw-modal').classList.remove('vis');isGM=true;go('gm');setupListeners();}
  else{document.getElementById('pw-err').textContent='비밀번호가 틀렸습니다';document.getElementById('pw-inp').value='';document.getElementById('pw-inp').focus();}
}

document.getElementById('btn-A').addEventListener('click',()=>pick('A'));
document.getElementById('btn-B').addEventListener('click',()=>pick('B'));
document.getElementById('join-btn').addEventListener('click',joinGame);
document.getElementById('name-inp').addEventListener('keypress',e=>{if(e.key==='Enter')joinGame();});
document.getElementById('pvs-a').addEventListener('click',()=>activatePVS('A'));
document.getElementById('pvs-b').addEventListener('click',()=>activatePVS('B'));
document.getElementById('start-btn').addEventListener('click',startGame);
document.getElementById('reset-btn').addEventListener('click',resetGame);
document.getElementById('replay-btn').addEventListener('click',replayGame);
document.getElementById('exit-gm-btn').addEventListener('click',()=>{isGM=false;go('entry');});
document.getElementById('gear').addEventListener('click',()=>{document.getElementById('pw-inp').value='';document.getElementById('pw-err').textContent='';document.getElementById('pw-modal').classList.add('vis');setTimeout(()=>document.getElementById('pw-inp').focus(),100);});
document.getElementById('pw-ok').addEventListener('click',chkPW);
document.getElementById('pw-cx').addEventListener('click',()=>document.getElementById('pw-modal').classList.remove('vis'));
document.getElementById('pw-inp').addEventListener('keypress',e=>{if(e.key==='Enter')chkPW();});

try{await signInAnonymously(auth);myUid=auth.currentUser.uid;}catch(e){console.error(e);}
</script>
